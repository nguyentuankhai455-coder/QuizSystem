<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngân hàng câu hỏi - QuizSystem</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        .top-header {
            background: white;
            padding: 12px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-header .logo {
            font-size: 22px;
            font-weight: 800;
            color: #2c3e50;
            cursor: pointer;
        }
        .top-header .logo span {
            color: #3498db;
        }

        .top-header .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-header .header-right .user-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .top-header .header-right .badge-role {
            background: #e8f4fd;
            color: #2980b9;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 24px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .breadcrumb span {
            cursor: pointer;
            transition: color 0.3s;
        }
        .breadcrumb span:hover {
            color: #3498db;
        }
        .breadcrumb .current {
            color: #2c3e50;
            font-weight: 600;
            cursor: default;
        }
        .breadcrumb .sep {
            color: #b0b8c4;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .page-header h2 {
            color: #2c3e50;
            font-size: 20px;
        }

        .question-grid {
            display: grid;
            gap: 12px;
        }

        .question-item {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 4px solid #3498db;
        }

        .question-item .q-content {
            flex: 1;
            color: #2c3e50;
            font-size: 15px;
        }

        .question-item .q-options {
            color: #7f8c8d;
            font-size: 13px;
            margin-top: 4px;
        }

        .question-item .q-options span {
            background: #e8edf5;
            padding: 2px 10px;
            border-radius: 12px;
            margin-right: 6px;
            font-size: 12px;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #95a5a6;
            background: white;
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .top-header {
                padding: 10px 16px;
            }
            .container {
                padding: 10px 16px;
            }
            .question-item {
                flex-direction: column;
                align-items: stretch;
            }
            .page-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="logo" onclick="window.location.href='dashboard.html'">📝 <span>Quiz</span>System</div>
        <div class="header-right">
            <span class="user-name" id="userDisplayName">👋 User</span>
            <span class="badge-role" id="userRoleBadge">Giáo viên</span>
            <button class="btn btn-danger" onclick="handleLogout()">🚪 Đăng xuất</button>
        </div>
    </header>

    <div class="container">

        <div class="breadcrumb">
            <span onclick="window.location.href='dashboard.html'">Trang chủ</span>
            <span class="sep">›</span>
            <span class="current">Ngân hàng câu hỏi</span>
        </div>

        <div class="page-header">
            <h2>📚 Ngân hàng câu hỏi</h2>
            <button class="btn btn-primary" onclick="window.location.href='create-exam.html'">
                <i class="fas fa-plus"></i> Thêm câu hỏi
            </button>
        </div>

        <div id="questionList" class="question-grid">
            <div class="no-data">📭 Chưa có câu hỏi nào trong ngân hàng</div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAF2LoIaOiM666hS7iqI5dLvdDZcgBis-k",
            authDomain: "quizsystem-1d1c2.firebaseapp.com",
            projectId: "quizsystem-1d1c2",
            storageBucket: "quizsystem-1d1c2.firebasestorage.app",
            messagingSenderId: "435483557148",
            appId: "1:435483557148:web:bde77e8d41f46009518ed9",
            measurementId: "G-FS5YZWPDD9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        function checkAuth() {
            const saved = localStorage.getItem('quizCurrentUser');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }
            try {
                currentUser = JSON.parse(saved);
            } catch (e) {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('userDisplayName').textContent = '👋 ' + (currentUser.fullname || currentUser.email);
            const roleLabel = currentUser.role === 'teacher' ? '👨‍🏫 Giáo viên' : '👨‍🎓 Học sinh';
            document.getElementById('userRoleBadge').textContent = roleLabel;

            loadQuestions();
        }

        function handleLogout() {
            if (!confirm('Bạn muốn đăng xuất?')) return;
            auth.signOut().then(() => {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            }).catch(() => {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            });
        }

        async function loadQuestions() {
            try {
                // Lấy tất cả câu hỏi từ các đề thi
                const snapshot = await db.collection('exams').get();
                let allQuestions = [];

                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.questions) {
                        data.questions.forEach(q => {
                            allQuestions.push({
                                ...q,
                                examTitle: data.title,
                                examId: doc.id
                            });
                        });
                    }
                });

                const container = document.getElementById('questionList');
                if (allQuestions.length === 0) {
                    container.innerHTML = `<div class="no-data">📭 Chưa có câu hỏi nào trong ngân hàng</div>`;
                    return;
                }

                container.innerHTML = allQuestions.map((q, idx) => `
                    <div class="question-item">
                        <div>
                            <div class="q-content">${idx + 1}. ${q.content}</div>
                            <div class="q-options">
                                ${q.options.map((opt, i) => `
                                    <span>${['A','B','C','D'][i]}: ${opt}</span>
                                `).join('')}
                                <span style="background:#27ae60; color:white; padding:2px 10px; border-radius:12px; font-size:12px;">
                                    ✅ Đáp án: ${['A','B','C','D'][q.correct]}
                                </span>
                            </div>
                            <div style="font-size:12px; color:#95a5a6; margin-top:4px;">
                                📄 Trong đề: "${q.examTitle}"
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Lỗi tải câu hỏi:', error);
            }
        }

        auth.onAuthStateChanged((user) => {
            if (!user) {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            }
        });

        checkAuth();
    </script>

</body>
</html>
