<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizSystem - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS GIỮ NGUYÊN NHƯ BẢN TRƯỚC --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: #2341cc; height: 100vh; display: flex; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 80px; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 20px; z-index: 10; }
        .logo { color: white; font-size: 32px; margin-bottom: 40px; margin-top: 10px; }
        .menu-items { display: flex; flex-direction: column; gap: 20px; width: 100%; align-items: center; }
        .menu-btn { width: 50px; height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #a5b4fc; font-size: 20px; cursor: pointer; transition: all 0.3s; border: none; background: transparent; }
        .menu-btn:hover { color: white; background-color: rgba(255, 255, 255, 0.1); }
        .menu-btn.active { background-color: #f0f4ff; color: #2341cc; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 55px; height: 55px; margin-left: -5px; }
        .sidebar-bottom { margin-top: auto; margin-bottom: 30px; }

        /* Main Content */
        .main-content { flex: 1; background-color: #f3f6fd; border-top-left-radius: 40px; border-bottom-left-radius: 40px; display: flex; flex-direction: column; padding: 20px 40px; overflow-y: auto; }
        
        /* Header */
        .header { display: flex; justify-content: flex-end; align-items: center; gap: 20px; margin-bottom: 40px; padding-top: 10px; }
        .btn-premium { background-color: #0ea5e9; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
        .flag-icon { font-size: 20px; cursor: pointer; }
        .notification { font-size: 20px; color: #64748b; cursor: pointer; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 600; font-size: 14px; color: #1e293b; }
        .user-role { font-size: 12px; color: #64748b; }

        /* Page Title & Toolbar */
        .page-title { font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 30px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-box { position: relative; width: 350px; }
        .search-box input { width: 100%; padding: 12px 16px; padding-right: 40px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: white; font-size: 14px; outline: none; color: #334155; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 14px; }
        .btn-add-teacher { background-color: #2a52d4; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(42, 82, 212, 0.3); transition: background 0.2s; }
        .btn-add-teacher:hover { background-color: #1e3ea8; }

        /* --- CSS MỚI CHO DANH SÁCH LỚP HỌC --- */
        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .class-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-left: 5px solid #2a52d4;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .class-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .class-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
        }

        .class-info {
            font-size: 14px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .class-info i {
            width: 16px;
            text-align: center;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-style: italic;
        }

    </style>
</head>
<body>

    <!-- Sidebar (Giữ nguyên) -->
    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-shapes"></i></div>
        <div class="menu-items">
            <button class="menu-btn active"><i class="fa-solid fa-layer-group"></i></button>
            <button class="menu-btn"><i class="fa-solid fa-book"></i></button>
            <button class="menu-btn"><i class="fa-solid fa-chart-simple"></i></button>
        </div>
        <div class="sidebar-bottom">
            <button class="menu-btn"><i class="fa-solid fa-gear"></i></button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="header">
            <button class="btn-premium"><i class="fa-regular fa-gem"></i> Bo quảng cáo</button>
            <div class="flag-icon">🇻🇳</div>
            <div class="notification"><i class="fa-regular fa-bell"></i></div>
            <div class="user-profile">
                <!-- Ảnh avatar sẽ được cập nhật từ Firebase Auth nếu có, tạm thời để mặc định -->
                <img src="https://ui-avatars.com/api/?name=Tuan+Khai&background=random" alt="Avatar" class="avatar" id="user-avatar">
                <div class="user-info">
                    <span class="user-name" id="user-name">Đang tải...</span>
                    <span class="user-role" id="user-role">Học sinh</span>
                </div>
            </div>
        </header>

        <h1 class="page-title">Danh sách lớp</h1>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Tìm kiếm theo tên lớp">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <button class="btn-add-teacher" id="btn-add-class">
                <i class="fa-solid fa-plus"></i> Tìm giáo viên
            </button>
        </div>

        <!-- KHU VỰC HIỂN THỊ DỮ LIỆU TỪ FIREBASE -->
        <div class="class-grid" id="class-list-container">
            <!-- Dữ liệu sẽ được JavaScript đổ vào đây -->
            <div class="loading">Đang kết nối Firebase và tải dữ liệu...</div>
        </div>
    </div>

    <!-- --- BẮT ĐẦU PHẦN JAVASCRIPT & FIREBASE --- -->
    
    <!-- 1. Nhúng Firebase SDK (Phiên bản 9 - Modular) -->
    <script type="module">
        // Import các hàm cần thiết từ Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        // Nếu bạn dùng Authentication, import thêm getAuth, onAuthStateChanged
        // import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        // 2. Cấu hình Firebase của bạn (THAY THẾ BẰNG CONFIG CỦA BẠN)
        const firebaseConfig = {
            apiKey: "AIzaSy...", // Thay bằng API Key của bạn
            authDomain: "quizsystem-demo.firebaseapp.com",
            projectId: "quizsystem-demo",
            storageBucket: "quizsystem-demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Khởi tạo Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 3. Lấy các phần tử HTML để hiển thị
        const classListContainer = document.getElementById('class-list-container');
        const userNameEl = document.getElementById('user-name');
        const userRoleEl = document.getElementById('user-role');
        const searchInput = document.getElementById('search-input');

        // Biến lưu trữ dữ liệu gốc để phục vụ tìm kiếm
        let allClasses = [];

        // 4. Hàm lấy dữ liệu từ Firestore
        async function fetchClasses() {
            try {
                // Lấy collection 'classes'
                const querySnapshot = await getDocs(collection(db, "classes"));
                
                // Xóa thông báo loading
                classListContainer.innerHTML = ''; 
                allClasses = []; // Reset mảng

                if (querySnapshot.empty) {
                    classListContainer.innerHTML = '<div class="loading">Chưa có lớp học nào.</div>';
                    return;
                }

                // Duyệt qua từng document và tạo HTML
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const classId = doc.id;
                    
                    // Lưu vào mảng để tìm kiếm
                    allClasses.push({ id: classId, ...data });

                    // Tạo card HTML
                    const cardHTML = `
                        <div class="class-card" onclick="alert('Bạn đã chọn lớp: ${data.name}')">
                            <div class="class-name">${data.name || 'Chưa đặt tên'}</div>
                            <div class="class-info">
                                <i class="fa-solid fa-chalkboard-user"></i> 
                                Giáo viên: ${data.teacher || 'Chưa cập nhật'}
                            </div>
                            <div class="class-info">
                                <i class="fa-solid fa-users"></i> 
                                Sĩ số: ${data.students || 0} học sinh
                            </div>
                            <div class="class-info" style="color: #10b981; font-weight: 500;">
                                <i class="fa-solid fa-circle-check"></i> 
                                ${data.status === 'active' ? 'Đang hoạt động' : 'Tạm dừng'}
                            </div>
                        </div>
                    `;
                    classListContainer.insertAdjacentHTML('beforeend', cardHTML);
                });

            } catch (error) {
                console.error("Lỗi khi lấy dữ liệu Firebase: ", error);
                classListContainer.innerHTML = `<div class="loading" style="color: red;">Lỗi kết nối Firebase: ${error.message}</div>`;
            }
        }

        // 5. Gọi hàm lấy dữ liệu khi trang tải xong
        fetchClasses();

        // --- (Tùy chọn) Cập nhật thông tin người dùng từ Firebase Auth ---
        // Nếu bạn đã làm chức năng Đăng nhập, đoạn này sẽ hiển thị tên thật
        /*
        const auth = getAuth();
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userNameEl.textContent = user.displayName || user.email;
                // userRoleEl.textContent = ... (lấy từ database user)
            } else {
                userNameEl.textContent = "Khách";
            }
        });
        */

        // 6. Logic Tìm kiếm (Client-side)
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            
            // Lọc mảng dữ liệu gốc
            const filtered = allClasses.filter(cls => 
                cls.name && cls.name.toLowerCase().includes(keyword)
            );

            // Render lại giao diện
            classListContainer.innerHTML = '';
            if (filtered.length === 0) {
                classListContainer.innerHTML = '<div class="loading">Không tìm thấy lớp nào phù hợp.</div>';
                return;
            }

            filtered.forEach(data => {
                const cardHTML = `
                    <div class="class-card">
                        <div class="class-name">${data.name}</div>
                        <div class="class-info"><i class="fa-solid fa-chalkboard-user"></i> GV: ${data.teacher || 'N/A'}</div>
                        <div class="class-info"><i class="fa-solid fa-users"></i> Sĩ số: ${data.students || 0}</div>
                    </div>
                `;
                classListContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        });

    </script>
</body>
</html>
