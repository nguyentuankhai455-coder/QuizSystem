<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizSystem - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: #2341cc; height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar - Đã căn chỉnh lại */
        .sidebar { 
            width: 80px; height: 100%; display: flex; flex-direction: column; 
            align-items: center; padding: 20px 0; z-index: 10; 
        }
        .logo { color: white; font-size: 32px; margin-bottom: 40px; }
        .menu-items { display: flex; flex-direction: column; gap: 24px; align-items: center; flex: 1; }
        .menu-btn { 
            width: 50px; height: 50px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            color: #a5b4fc; font-size: 20px; cursor: pointer; 
            transition: all 0.3s; border: none; background: transparent; 
        }
        .menu-btn:hover { color: white; background-color: rgba(255, 255, 255, 0.1); }
        .menu-btn.active { 
            background-color: #ffffff; color: #2341cc; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            transform: scale(1.1);
        }
        .sidebar-bottom { margin-top: auto; }

        /* Main Content */
        .main-content { 
            flex: 1; background-color: #f3f6fd; 
            border-top-left-radius: 40px; border-bottom-left-radius: 40px; 
            display: flex; flex-direction: column; padding: 20px 40px; 
            overflow-y: auto; 
        }

        /* Header */
        .header { display: flex; justify-content: flex-end; align-items: center; gap: 20px; margin-bottom: 40px; padding-top: 10px; }
        .btn-premium { background-color: #0ea5e9; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
        .flag-icon { font-size: 20px; cursor: pointer; }
        .notification { font-size: 20px; color: #64748b; cursor: pointer; }

        .user-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; position: relative; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 600; font-size: 14px; color: #1e293b; }
        .user-role { font-size: 12px; color: #64748b; }

        .dropdown-menu { position: absolute; top: 50px; right: 0; background: white; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 170px; display: none; flex-direction: column; overflow: hidden; z-index: 100; }
        .dropdown-menu.show { display: flex; }
        .dropdown-item { padding: 12px 16px; font-size: 14px; color: #334155; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .dropdown-item:hover { background-color: #f1f5f9; }
        .dropdown-item.logout:hover { background-color: #fef2f2; color: #ef4444; }

        /* Title & Toolbar */
        .page-title { font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 30px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-box { position: relative; width: 350px; }
        .search-box input { width: 100%; padding: 12px 16px; padding-right: 40px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: white; font-size: 14px; outline: none; }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 14px; }
        .btn-add-teacher { background-color: #2a52d4; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .btn-add-teacher:hover { background-color: #1e3ea8; }

        /* Class Grid */
        .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .class-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-left: 5px solid #2a52d4; position: relative; display: flex; flex-direction: column; gap: 10px; }
        .class-name { font-size: 18px; font-weight: 700; color: #1e293b; padding-right: 60px; }
        .class-info { font-size: 14px; color: #64748b; display: flex; align-items: center; gap: 8px; }
        
        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; opacity: 0; transition: opacity 0.2s; }
        .class-card:hover .card-actions { opacity: 1; }
        .action-btn { width: 30px; height: 30px; border-radius: 6px; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 12px; }
        .btn-edit { background: #e0e7ff; color: #2a52d4; }
        .btn-delete { background: #fee2e2; color: #ef4444; }

        .loading { text-align: center; padding: 40px; color: #64748b; font-style: italic; grid-column: 1 / -1; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: white; width: 400px; border-radius: 12px; padding: 24px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 700; }
        .close-modal { background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
        .btn-cancel { padding: 10px 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; cursor: pointer; }
        .btn-save { padding: 10px 16px; border-radius: 6px; border: none; background: #2a52d4; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-shapes"></i></div>
        <div class="menu-items">
            <!-- Nút Dashboard (Active mặc định) -->
            <button class="menu-btn active" data-tab="dashboard" onclick="switchTab('dashboard', this)">
                <i class="fa-solid fa-layer-group"></i>
            </button>
            <!-- Nút Khóa học -->
            <button class="menu-btn" data-tab="courses" onclick="switchTab('courses', this)">
                <i class="fa-solid fa-book"></i>
            </button>
            <!-- Nút Thống kê -->
            <button class="menu-btn" data-tab="stats" onclick="switchTab('stats', this)">
                <i class="fa-solid fa-chart-simple"></i>
            </button>
        </div>
        <div class="sidebar-bottom">
            <button class="menu-btn" onclick="alert('Cài đặt')"><i class="fa-solid fa-gear"></i></button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="header">
            <button class="btn-premium"><i class="fa-regular fa-gem"></i> Bo quảng cáo</button>
            <div class="flag-icon">🇻🇳</div>
            <div class="notification"><i class="fa-regular fa-bell"></i></div>
            <div class="user-profile" id="user-profile-btn">
                <img src="https://ui-avatars.com/api/?name=User&background=random" class="avatar" id="user-avatar">
                <div class="user-info">
                    <span class="user-name" id="user-name">Đang tải...</span>
                    <span class="user-role" id="user-role">Học sinh</span>
                </div>
                <div class="dropdown-menu" id="user-dropdown">
                    <div class="dropdown-item"><i class="fa-regular fa-user"></i> Trang cá nhân</div>
                    <div class="dropdown-item logout" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất</div>
                </div>
            </div>
        </header>

        <h1 class="page-title" id="page-title-text">Danh sách lớp</h1>

        <div class="toolbar" id="toolbar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Tìm kiếm theo tên lớp">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <button class="btn-add-teacher" id="btn-open-modal">
                <i class="fa-solid fa-plus"></i> Tìm giáo viên
            </button>
        </div>

        <div class="class-grid" id="class-list-container">
            <div class="loading">Đang kết nối Firebase và tải dữ liệu...</div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="class-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Thêm lớp học</h2>
                <button class="close-modal" id="btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="class-form">
                <input type="hidden" id="class-id-hidden">
                <div class="form-group">
                    <label>Tên lớp học</label>
                    <input type="text" id="input-class-name" required>
                </div>
                <div class="form-group">
                    <label>Giáo viên</label>
                    <input type="text" id="input-teacher-name" required>
                </div>
                <div class="form-group">
                    <label>Sĩ số</label>
                    <input type="number" id="input-student-count" value="0">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="btn-cancel-modal">Hủy</button>
                    <button type="submit" class="btn-save">Lưu</button>
                </div>
            </form>
        </div>
    </div>

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "quizsystem-demo.firebaseapp.com",
        projectId: "quizsystem-demo",
        storageBucket: "quizsystem-demo.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const classListContainer = document.getElementById('class-list-container');
    const searchInput = document.getElementById('search-input');
    const modal = document.getElementById('class-modal');
    const form = document.getElementById('class-form');
    const modalTitle = document.getElementById('modal-title');
    const toolbarEl = document.getElementById('toolbar');

    let allClasses = [];
    let hasRedirected = false; // 🔒 Cờ chống loop redirect

    // --- 0. KIỂM TRA ĐĂNG NHẬP (ĐÃ FIX) ---
    onAuthStateChanged(auth, (user) => {
        if (hasRedirected) return;
        
        if (user) {
            // ✅ Đã đăng nhập
            document.getElementById('user-name').textContent = 
                user.displayName || user.email.split('@')[0];
            if (user.photoURL) {
                document.getElementById('user-avatar').src = user.photoURL;
            }
            sessionStorage.removeItem('redirecting');
            fetchClasses();
        } else {
            // ❌ Chưa đăng nhập → chờ 1s rồi mới chuyển (tránh loop)
            setTimeout(() => {
                if (!auth.currentUser && !hasRedirected) {
                    hasRedirected = true;
                    console.log("→ Chuyển về index.html");
                    window.location.replace('index.html'); // replace thay href
                }
            }, 1000);
        }
    });

    // --- 1. FETCH DATA ---
    async function fetchClasses() {
        try {
            classListContainer.innerHTML = '<div class="loading">Đang tải...</div>';
            const querySnapshot = await getDocs(collection(db, "classes"));
            allClasses = [];

            if (querySnapshot.empty) {
                classListContainer.innerHTML = '<div class="loading">Chưa có lớp học. Hãy thêm mới!</div>';
                return;
            }

            querySnapshot.forEach((docSnap) => {
                allClasses.push({ id: docSnap.id, ...docSnap.data() });
            });

            renderClasses(allClasses);
        } catch (error) {
            console.error("Lỗi:", error);
            classListContainer.innerHTML = `
                <div class="loading" style="color:red; text-align:left;">
                    <b>Lỗi Firebase:</b> ${error.message}<br>
                    Kiểm tra firebaseConfig và Firestore Rules.
                </div>`;
        }
    }

    // --- 2. RENDER ---
    function renderClasses(dataArray) {
        classListContainer.innerHTML = '';
        if (dataArray.length === 0) {
            classListContainer.innerHTML = '<div class="loading">Không có lớp nào.</div>';
            return;
        }

        dataArray.forEach(data => {
            const cardHTML = `
                <div class="class-card">
                    <div class="card-actions">
                        <button class="action-btn btn-edit" onclick="editClass('${data.id}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="action-btn btn-delete" onclick="deleteClass('${data.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="class-name">${data.name || 'Chưa đặt tên'}</div>
                    <div class="class-info"><i class="fa-solid fa-chalkboard-user"></i> GV: ${data.teacher || 'N/A'}</div>
                    <div class="class-info"><i class="fa-solid fa-users"></i> Sĩ số: ${data.students || 0}</div>
                </div>
            `;
            classListContainer.insertAdjacentHTML('beforeend', cardHTML);
        });
    }

    // --- 3. MODAL ---
    document.getElementById('btn-open-modal').addEventListener('click', () => {
        form.reset();
        document.getElementById('class-id-hidden').value = '';
        modalTitle.textContent = 'Thêm lớp học mới';
        modal.classList.add('show');
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.remove('show'));
    document.getElementById('btn-cancel-modal').addEventListener('click', () => modal.classList.remove('show'));

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('class-id-hidden').value;
        const classData = {
            name: document.getElementById('input-class-name').value,
            teacher: document.getElementById('input-teacher-name').value,
            students: parseInt(document.getElementById('input-student-count').value) || 0,
            status: 'active'
        };

        try {
            if (id) {
                await updateDoc(doc(db, "classes", id), classData);
            } else {
                await addDoc(collection(db, "classes"), classData);
            }
            modal.classList.remove('show');
            fetchClasses();
        } catch (error) { alert('Lỗi: ' + error.message); }
    });

    window.editClass = (id) => {
        const cls = allClasses.find(c => c.id === id);
        if (cls) {
            document.getElementById('class-id-hidden').value = cls.id;
            document.getElementById('input-class-name').value = cls.name || '';
            document.getElementById('input-teacher-name').value = cls.teacher || '';
            document.getElementById('input-student-count').value = cls.students || 0;
            modalTitle.textContent = 'Chỉnh sửa lớp học';
            modal.classList.add('show');
        }
    };

    window.deleteClass = async (id) => {
        if (confirm('Xóa lớp này?')) {
            try {
                await deleteDoc(doc(db, "classes", id));
                fetchClasses();
            } catch (error) { alert('Lỗi: ' + error.message); }
        }
    };

    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase();
        const filtered = allClasses.filter(cls => cls.name && cls.name.toLowerCase().includes(keyword));
        renderClasses(filtered);
    });

    window.switchTab = (tabName, btnElement) => {
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        const titleEl = document.getElementById('page-title-text');
        const grid = document.getElementById('class-list-container');

        if (tabName === 'dashboard') {
            titleEl.textContent = 'Danh sách lớp';
            toolbarEl.style.display = 'flex';
            grid.style.display = 'grid';
            fetchClasses();
        } else if (tabName === 'courses') {
            titleEl.textContent = 'Khóa học của tôi';
            toolbarEl.style.display = 'none';
            grid.style.display = 'block';
            grid.innerHTML = '<div class="loading">Đang xây dựng...</div>';
        } else if (tabName === 'stats') {
            titleEl.textContent = 'Thống kê điểm số';
            toolbarEl.style.display = 'none';
            grid.style.display = 'block';
            grid.innerHTML = '<div class="loading">Đang xây dựng...</div>';
        }
    };

    document.getElementById('user-profile-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('user-dropdown').classList.toggle('show');
    });
    document.addEventListener('click', () => document.getElementById('user-dropdown').classList.remove('show'));

    window.logout = async () => {
        if (confirm('Đăng xuất?')) {
            try {
                hasRedirected = true; // 🔒 Chặn loop khi logout
                await signOut(auth);
                window.location.replace('index.html');
            } catch (error) {
                window.location.replace('index.html');
            }
        }
    };
</script>
</body>
</html>
