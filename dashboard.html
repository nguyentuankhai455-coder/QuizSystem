<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizSystem - Quản lý lớp học</title>
    <!-- Nhúng Font Google (Roboto) để giống giao diện -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Nhúng Font Awesome để lấy icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CÀI ĐẶT CHUNG --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #2341cc; /* Màu nền xanh đậm bên ngoài */
            height: 100vh;
            display: flex;
            overflow: hidden; /* Ngăn cuộn toàn trang */
        }

        /* --- SIDEBAR (THANH BÊN TRÁI) --- */
        .sidebar {
            width: 80px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            position: relative;
            z-index: 10;
        }

        .logo {
            color: white;
            font-size: 32px;
            margin-bottom: 40px;
            margin-top: 10px;
        }

        /* Các nút menu */
        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            align-items: center;
        }

        .menu-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #a5b4fc; /* Màu icon chưa chọn */
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            background: transparent;
        }

        .menu-btn:hover {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Nút đang được chọn (Active) */
        .menu-btn.active {
            background-color: #f0f4ff; /* Màu nền sáng */
            color: #2341cc; /* Màu icon xanh */
            border-radius: 50%; /* Bo tròn hoàn toàn */
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            /* Tạo hình dáng lồi ra một chút */
            width: 55px;
            height: 55px;
            margin-left: -5px; 
        }

        /* Nút Settings ở dưới cùng */
        .sidebar-bottom {
            margin-top: auto;
            margin-bottom: 30px;
        }

        /* --- MAIN CONTENT (KHU VỰC CHÍNH) --- */
        .main-content {
            flex: 1;
            background-color: #f3f6fd; /* Màu nền xám nhạt */
            border-top-left-radius: 40px; /* Bo góc trên trái */
            border-bottom-left-radius: 40px;
            display: flex;
            flex-direction: column;
            padding: 20px 40px;
            overflow-y: auto;
            position: relative;
        }

        /* --- HEADER (THANH TRÊN CÙNG) --- */
        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            padding-top: 10px;
        }

        /* Nút Bo quảng cáo */
        .btn-premium {
            background-color: #0ea5e9; /* Màu xanh lơ */
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .flag-icon {
            font-size: 20px;
            cursor: pointer;
        }

        .notification {
            font-size: 20px;
            color: #64748b;
            cursor: pointer;
        }

        /* Thông tin người dùng */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
        }

        .user-role {
            font-size: 12px;
            color: #64748b;
        }

        /* --- NỘI DUNG CHÍNH --- */
        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 30px;
        }

        /* Thanh tìm kiếm và nút thêm */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .search-box {
            position: relative;
            width: 350px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            padding-right: 40px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: white;
            font-size: 14px;
            outline: none;
            color: #334155;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .search-box input::placeholder {
            color: #94a3b8;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
        }

        .btn-add-teacher {
            background-color: #2a52d4; /* Màu xanh đậm */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(42, 82, 212, 0.3);
            transition: background 0.2s;
        }

        .btn-add-teacher:hover {
            background-color: #1e3ea8;
        }

        /* Khu vực hiển thị danh sách (Đang trống theo hình) */
        .list-area {
            flex: 1;
            /* Có thể thêm grid hoặc flex để hiển thị danh sách lớp học ở đây */
        }

    </style>
</head>
<body>

    <!-- Sidebar bên trái -->
    <div class="sidebar">
        <!-- Logo -->
        <div class="logo">
            <!-- Sử dụng icon hình tam giác lồng nhau giống logo -->
            <i class="fa-solid fa-shapes"></i>
        </div>

        <!-- Menu -->
        <div class="menu-items">
            <!-- Nút được chọn (Active) - Giống hình 2 -->
            <button class="menu-btn active">
                <i class="fa-solid fa-layer-group"></i>
            </button>
            <!-- Các nút khác -->
            <button class="menu-btn">
                <i class="fa-solid fa-book"></i>
            </button>
            <button class="menu-btn">
                <i class="fa-solid fa-chart-simple"></i>
            </button>
        </div>

        <!-- Nút cài đặt dưới cùng -->
        <div class="sidebar-bottom">
            <button class="menu-btn">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </div>

    <!-- Nội dung chính bên phải -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <!-- Nút Bo quảng cáo -->
            <button class="btn-premium">
                <i class="fa-regular fa-gem"></i> Bo quảng cáo
            </button>
            
            <!-- Cờ Việt Nam -->
            <div class="flag-icon">
                🇻🇳
            </div>

            <!-- Chuông thông báo -->
            <div class="notification">
                <i class="fa-regular fa-bell"></i>
            </div>

            <!-- Thông tin người dùng -->
            <div class="user-profile">
                <!-- Ảnh đại diện (Placeholder) -->
                <img src="https://ui-avatars.com/api/?name=Tuan+Khai&background=random" alt="Avatar" class="avatar">
                <div class="user-info">
                    <span class="user-name">tuấn khải nguyên</span>
                    <span class="user-role">Học sinh</span>
                </div>
            </div>
        </header>

        <!-- Tiêu đề trang -->
        <h1 class="page-title">Danh sách lớp</h1>

        <!-- Thanh công cụ (Tìm kiếm + Nút thêm) -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" placeholder="Tìm kiếm theo tên lớp">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <!-- Nút này trong hình là "Tìm giáo viên" -->
            <!-- Nếu là giao diện Học viên, bạn có thể đổi thành "Tham gia lớp" -->
            <button class="btn-add-teacher">
                <i class="fa-solid fa-plus"></i> Tìm giáo viên
            </button>
        </div>

        <!-- Khu vực danh sách (Trống) -->
        <div class="list-area">
            <!-- Nội dung danh sách lớp sẽ được render ở đây -->
        </div>
    </div>

</body>
</html>
