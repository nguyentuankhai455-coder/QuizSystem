<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập - QuizSystem</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        .top-header {
            background: white;
            padding: 12px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-header .logo {
            font-size: 22px;
            font-weight: 800;
            color: #2c3e50;
            cursor: pointer;
        }
        .top-header .logo span {
            color: #3498db;
        }

        .top-header .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-header .header-right .user-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .top-header .header-right .badge-role {
            background: #e8f4fd;
            color: #2980b9;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background: #229954;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 24px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .breadcrumb span {
            cursor: pointer;
            transition: color 0.3s;
        }
        .breadcrumb span:hover {
            color: #3498db;
        }
        .breadcrumb .current {
            color: #2c3e50;
            font-weight: 600;
            cursor: default;
        }
        .breadcrumb .sep {
            color: #b0b8c4;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3498db;
        }

        .exam-grid {
            display: grid;
            gap: 12px;
        }

        .exam-item {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.3s;
            border-left: 4px solid #27ae60;
            cursor: pointer;
        }

        .exam-item:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            border-color: #3498db;
        }

        .exam-item .exam-info h4 {
            color: #2c3e50;
            font-size: 15px;
        }

        .exam-item .exam-info p {
            color: #7f8c8d;
            font-size: 13px;
            margin-top: 3px;
        }

        .exam-item .exam-info .tags {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .exam-item .exam-info .tags .tag {
            background: #e8edf5;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #2c3e50;
        }

        .exam-item .exam-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .exam-item .exam-status .status-badge {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .exam-item .exam-status .status-badge.not-started {
            background: #fde8e8;
            color: #e74c3c;
        }

        .exam-item .exam-status .status-badge.in-progress {
            background: #fff3cd;
            color: #856404;
        }

        .exam-item .exam-status .status-badge.completed {
            background: #d4edda;
            color: #27ae60;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #95a5a6;
        }

        .empty-state .icon {
            font-size: 56px;
            color: #d0d7e6;
            margin-bottom: 12px;
        }

        .empty-state h4 {
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 14px;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #3498db;
        }

        .loading-spinner i {
            font-size: 32px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .top-header {
                padding: 10px 16px;
            }
            .container {
                padding: 10px 16px;
            }
            .exam-item {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="logo" onclick="window.location.href='dashboard.html'">📝 <span>Quiz</span>System</div>
        <div class="header-right">
            <span class="user-name" id="userDisplayName">👋 Học sinh</span>
            <span class="badge-role" id="userRoleBadge">Học sinh</span>
            <button class="btn btn-danger" onclick="handleLogout()">🚪 Đăng xuất</button>
        </div>
    </header>

    <div class="container">

        <div class="breadcrumb">
            <span onclick="window.location.href='dashboard.html'">Trang chủ</span>
            <span class="sep">›</span>
            <span class="current">Bài tập / Đề thi</span>
        </div>

        <div class="search-box">
            <input type="text" id="searchExam" placeholder="🔍 Tìm kiếm đề thi..." oninput="filterExams()">
            <button class="btn btn-secondary" onclick="document.getElementById('searchExam').value=''; filterExams();">
                <i class="fas fa-times"></i> Xóa
            </button>
        </div>

        <div id="examList" class="exam-grid"></div>

        <div id="loading" class="loading-spinner" style="display:none;">
            <i class="fas fa-spinner"></i>
            <p style="margin-top:8px;">Đang tải danh sách đề thi...</p>
        </div>

    </div>

    <script>
        // ============================================================
        // FIREBASE
        // ============================================================

        const firebaseConfig = {
            apiKey: "AIzaSyAF2LoIaOiM666hS7iqI5dLvdDZcgBis-k",
            authDomain: "quizsystem-1d1c2.firebaseapp.com",
            projectId: "quizsystem-1d1c2",
            storageBucket: "quizsystem-1d1c2.firebasestorage.app",
            messagingSenderId: "435483557148",
            appId: "1:435483557148:web:bde77e8d41f46009518ed9",
            measurementId: "G-FS5YZWPDD9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // BIẾN TOÀN CỤ
        // ============================================================

        let currentUser = null;
        let allExams = [];

        // ============================================================
        // AUTH
        // ============================================================

        function checkAuth() {
            const saved = localStorage.getItem('quizCurrentUser');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }
            try {
                currentUser = JSON.parse(saved);
            } catch (e) {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('userDisplayName').textContent = '👋 ' + (currentUser.fullname || currentUser.email);
            document.getElementById('userRoleBadge').textContent = '👨‍🎓 Học sinh';

            loadExams();
        }

        function handleLogout() {
            if (!confirm('Bạn muốn đăng xuất?')) return;
            auth.signOut().then(() => {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            }).catch(() => {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            });
        }

        // ============================================================
        // LOAD EXAMS
        // ============================================================

        async function loadExams() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';

            try {
                const snapshot = await db.collection('exams')
                    .orderBy('createdAt', 'desc')
                    .get();

                allExams = [];
                snapshot.forEach(doc => {
                    allExams.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                renderExams();

            } catch (error) {
                console.error('Lỗi tải đề thi:', error);
                renderEmptyState('error');
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        // ============================================================
        // RENDER EXAMS
        // ============================================================

        function renderExams() {
            const container = document.getElementById('examList');

            if (allExams.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h4>Chưa có đề thi nào</h4>
                        <p>Giáo viên sẽ giao đề thi cho bạn!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = allExams.map(exam => {
                const questionCount = exam.questions ? exam.questions.length : 0;
                const createdDate = exam.createdAt || 'Mới tạo';

                return `
                    <div class="exam-item" onclick="startExam('${exam.id}', '${exam.title || 'Đề thi'}')" data-examname="${(exam.title || '').toLowerCase()}">
                        <div class="exam-info">
                            <h4>📄 ${exam.title || 'Đề thi không tên'}</h4>
                            <p>⏱ ${exam.duration || 0} phút · ${questionCount} câu hỏi</p>
                            <div class="tags">
                                <span class="tag">📅 ${createdDate}</span>
                                <span class="tag">👥 ${exam.attempts || 0} lượt làm</span>
                                ${exam.status ? `<span class="tag">${exam.status}</span>` : ''}
                            </div>
                        </div>
                        <div class="exam-actions">
                            <div class="exam-status">
                                <span class="status-badge not-started">📝 Chưa làm</span>
                            </div>
                            <button class="btn btn-success btn-sm">
                                <i class="fas fa-play"></i> Làm bài
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // FILTER
        // ============================================================

        function filterExams() {
            const keyword = document.getElementById('searchExam').value.toLowerCase();
            const items = document.querySelectorAll('.exam-item');

            items.forEach(item => {
                const name = item.dataset.examname || '';
                item.style.display = name.includes(keyword) ? 'flex' : 'none';
            });
        }

        // ============================================================
        // START EXAM
        // ============================================================

        function startExam(examId, examName) {
            if (!examId) {
                examId = 'demo_' + Date.now();
            }
            window.location.href = 'exam-detail.html?id=' + examId;
        }

        // ============================================================
        // EMPTY STATE
        // ============================================================

        function renderEmptyState(type) {
            const container = document.getElementById('examList');
            if (type === 'error') {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <h4>Không thể tải dữ liệu</h4>
                        <p>Vui lòng kiểm tra kết nối mạng và thử lại.</p>
                        <button class="btn btn-primary" onclick="loadExams()" style="margin-top:12px;">
                            <i class="fas fa-sync"></i> Thử lại
                        </button>
                    </div>
                `;
            }
        }

        // ============================================================
        // INIT
        // ============================================================

        auth.onAuthStateChanged((user) => {
            if (!user) {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            }
        });

        checkAuth();
    </script>

</body>
</html>
