<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - QuizSystem</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #c7d2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(79, 70, 229, 0.15);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-container .logo { text-align: center; margin-bottom: 32px; }
        .login-container .logo .icon { font-size: 48px; display: block; margin-bottom: 8px; }
        .login-container .logo h1 { font-size: 28px; font-weight: 700; color: #1a1a2e; }
        .login-container .logo h1 span { color: #4f46e5; }
        .login-container .logo p { color: #718096; font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; color: #4a5568; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: #f8fafc;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
            background: white;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .form-options label { display: flex; align-items: center; gap: 8px; color: #4a5568; cursor: pointer; }
        .form-options label input[type="checkbox"] { width: 16px; height: 16px; accent-color: #4f46e5; cursor: pointer; }
        .form-options a { color: #4f46e5; text-decoration: none; font-weight: 600; }
        .form-options a:hover { text-decoration: underline; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(79, 70, 229, 0.35); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-google {
            background: white;
            color: #1a1a2e;
            border: 2px solid #e2e8f0;
        }
        .btn-google:hover { background: #f8fafc; border-color: #cbd5e0; }
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: #a0aec0;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
        }
        .register-link a { color: #4f46e5; text-decoration: none; font-weight: 600; }
        .register-link a:hover { text-decoration: underline; }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a1a2e;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            animation: slideUp 0.3s ease;
            font-size: 14px;
            max-width: 400px;
        }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }
        .toast.hidden { display: none; }
        @media (max-width: 480px) {
            .login-container { padding: 32px 24px; }
            .form-options { flex-direction: column; gap: 10px; align-items: flex-start; }
            .toast { bottom: 12px; right: 12px; left: 12px; max-width: none; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <span class="icon">📚</span>
            <h1><span>Quiz</span>System</h1>
            <p>Hệ thống quản lý thi trắc nghiệm</p>
        </div>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" placeholder="Nhập email của bạn..." required>
            </div>
            <div class="form-group">
                <label for="password">🔑 Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
            </div>
            <div class="form-options">
                <label><input type="checkbox" id="remember-me"> Ghi nhớ đăng nhập</label>
                <a href="#" onclick="showToast('📧 Vui lòng liên hệ admin để đặt lại mật khẩu', 'error')">Quên mật khẩu?</a>
            </div>
            <button type="submit" class="btn btn-primary" id="login-btn">🔓 Đăng nhập</button>
        </form>
        
        <div class="divider">Hoặc</div>
        <button class="btn btn-google" onclick="handleGoogleLogin()">
            <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Đăng nhập với Google
        </button>
        
        <div class="register-link">
            Chưa có tài khoản? <a href="#" onclick="showToast('📧 Vui lòng liên hệ admin để tạo tài khoản', 'error')">Đăng ký ngay</a>
        </div>
    </div>
    
    <div id="toast" class="toast hidden"></div>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAF2LoIaOiM666hS7iqI5dLvdDZcgBis-k",
            authDomain: "quizsystem-1d1c2.firebaseapp.com",
            databaseURL: "https://quizsystem-1d1c2-default-rtdb.firebaseio.com",
            projectId: "quizsystem-1d1c2",
            storageBucket: "quizsystem-1d1c2.firebasestorage.app",
            messagingSenderId: "435483557148",
            appId: "1:435483557148:web:bde77e8d41f46009518ed9",
            measurementId: "G-FS5YZWPDD9"
        };
        
        let auth = null;
        let firebaseReady = false;
        
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            firebaseReady = true;
            console.log('✅ Firebase Auth connected');
        } catch (e) {
            console.warn('⚠️ Firebase init failed:', e.message);
        }
        
        function showToast(msg, type = 'success') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = `toast ${type}`;
            el.classList.remove('hidden');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.add('hidden'), 4000);
        }
        
        function checkAuthState() {
            if (!firebaseReady || !auth) return;
            auth.onAuthStateChanged(user => {
                if (user) {
                    localStorage.setItem('userId', user.uid);
                    localStorage.setItem('userEmail', user.email);
                    localStorage.setItem('userName', user.displayName || user.email?.split('@')[0] || 'User');
                    window.location.href = 'dashboard.html';
                }
            });
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            if (!firebaseReady || !auth) {
                showToast('⚠️ Không thể kết nối Firebase. Vui lòng thử lại.', 'error');
                return;
            }
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            if (!email || !password) {
                showToast('⚠️ Vui lòng nhập email và mật khẩu', 'error');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '⏳ Đang đăng nhập...';
            try {
                const result = await auth.signInWithEmailAndPassword(email, password);
                const user = result.user;
                localStorage.setItem('userId', user.uid);
                localStorage.setItem('userEmail', user.email);
                localStorage.setItem('userName', user.displayName || user.email?.split('@')[0] || 'User');
                if (document.getElementById('remember-me').checked) {
                    localStorage.setItem('rememberMe', 'true');
                } else {
                    localStorage.removeItem('rememberMe');
                }
                showToast('✅ Đăng nhập thành công!', 'success');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
            } catch (error) {
                console.error('Login error:', error);
                let errorMsg = '❌ Đăng nhập thất bại. Vui lòng thử lại.';
                switch (error.code) {
                    case 'auth/user-not-found': errorMsg = '❌ Không tìm thấy tài khoản với email này.'; break;
                    case 'auth/wrong-password': errorMsg = '❌ Mật khẩu không đúng. Vui lòng thử lại.'; break;
                    case 'auth/invalid-email': errorMsg = '❌ Email không hợp lệ.'; break;
                    case 'auth/user-disabled': errorMsg = '❌ Tài khoản đã bị vô hiệu hóa.'; break;
                    case 'auth/too-many-requests': errorMsg = '❌ Quá nhiều lần đăng nhập sai. Vui lòng thử lại sau.'; break;
                }
                showToast(errorMsg, 'error');
                btn.disabled = false;
                btn.innerHTML = '🔓 Đăng nhập';
            }
        }
        
        async function handleGoogleLogin() {
            if (!firebaseReady || !auth) {
                showToast('⚠️ Không thể kết nối Firebase. Vui lòng thử lại.', 'error');
                return;
            }
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                localStorage.setItem('userId', user.uid);
                localStorage.setItem('userEmail', user.email);
                localStorage.setItem('userName', user.displayName || user.email?.split('@')[0] || 'User');
                localStorage.setItem('userPhoto', user.photoURL || '');
                showToast('✅ Đăng nhập thành công!', 'success');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
            } catch (error) {
                console.error('Google login error:', error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    showToast('❌ Đăng nhập Google thất bại. Vui lòng thử lại.', 'error');
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('rememberMe') === 'true') {
                const savedEmail = localStorage.getItem('userEmail');
                if (savedEmail) {
                    document.getElementById('email').value = savedEmail;
                    document.getElementById('remember-me').checked = true;
                }
            }
            checkAuthState();
        });
    </script>
</body>
</html>
