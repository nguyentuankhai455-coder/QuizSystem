<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - QuizSystem</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2341cc 0%, #4c6ef5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 700;
            color: #2341cc;
            letter-spacing: 1px;
        }

        .logo-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: #2341cc;
            box-shadow: 0 0 0 3px rgba(35, 65, 204, 0.1);
        }

        .form-group .input-icon {
            position: absolute;
            left: 15px;
            top: 42px;
            color: #94a3b8;
            font-size: 14px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            cursor: pointer;
        }

        .form-options a {
            color: #2341cc;
            text-decoration: none;
            font-weight: 500;
        }

        .form-options a:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #2341cc;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-login:hover { background: #1e3ea8; transform: translateY(-1px); }
        .btn-login:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: white;
            color: #334155;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-google:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn-google img { width: 20px; height: 20px; }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #64748b;
        }

        .register-link a {
            color: #2341cc;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .register-link a:hover { text-decoration: underline; }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #dc2626;
        }

        .error-message.show { display: block; }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">📚</div>
            <div class="logo-text">QuizSystem</div>
        </div>
        <p class="logo-subtitle">Hệ thống quản lý thi trắc nghiệm</p>

        <div class="error-message" id="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label>📧 Email</label>
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="email" placeholder="Nhập email của bạn" required>
            </div>

            <div class="form-group">
                <label>🔑 Mật khẩu</label>
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="remember"> Ghi nhớ đăng nhập
                </label>
                <a href="#" onclick="alert('Vui lòng liên hệ admin để reset mật khẩu')">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-login" id="btn-login">
                🔓 Đăng nhập
            </button>
        </form>

        <div class="divider">Hoặc</div>

        <button class="btn-google" id="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Đăng nhập với Google
        </button>

        <p class="register-link">
            Chưa có tài khoản? <a href="#" onclick="alert('Chức năng đăng ký đang phát triển')">Đăng ký ngay</a>
        </p>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        // ⚠️⚠️⚠️ THAY BẰNG CONFIG CỦA BẠN ⚠️⚠️⚠️
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "quizsystem-demo.firebaseapp.com",
            projectId: "quizsystem-demo",
            storageBucket: "quizsystem-demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember');
        const btnLogin = document.getElementById('btn-login');
        const btnGoogle = document.getElementById('btn-google');
        const errorMessage = document.getElementById('error-message');

        // Hàm hiển thị lỗi
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('show');
            setTimeout(() => errorMessage.classList.remove('show'), 5000);
        }

        // Hàm chuyển sang dashboard (dùng replace để không bị back)
        function goToDashboard() {
            window.location.replace('dashboard.html');
        }

        // ==========================================
        // 🔒 CHỐNG LOOP REDIRECT - LOGIC CHÍNH
        // ==========================================
        
        // Cờ đánh dấu đang trong quá trình đăng nhập (tránh bị redirect tự động)
        let isLoggingIn = false;
        
        // Kiểm tra xem user vừa logout (để không tự động đăng nhập lại)
        const justLoggedOut = sessionStorage.getItem('justLoggedOut') === 'true';
        
        if (justLoggedOut) {
            // Xóa cờ sau khi đã kiểm tra
            sessionStorage.removeItem('justLoggedOut');
            console.log("Vừa logout → không tự động chuyển trang");
        }

        // Lắng nghe trạng thái đăng nhập
        onAuthStateChanged(auth, (user) => {
            console.log("Auth state:", user ? `Đã đăng nhập (${user.email})` : "Chưa đăng nhập");
            
            // Chỉ tự động chuyển nếu:
            // 1. Đã đăng nhập
            // 2. KHÔNG phải đang trong quá trình login thủ công
            // 3. KHÔNG phải vừa logout
            // 4. Chưa từng redirect (dùng sessionStorage để chống loop)
            if (user && !isLoggingIn && !justLoggedOut) {
                const hasRedirected = sessionStorage.getItem('redirected_to_dashboard');
                if (hasRedirected) {
                    console.log("Đã redirect trước đó → bỏ qua để tránh loop");
                    return;
                }
                
                console.log("Đã đăng nhập sẵn → chuyển dashboard");
                sessionStorage.setItem('redirected_to_dashboard', 'true');
                
                // Delay 1 chút để đảm bảo session đã ổn định
                setTimeout(goToDashboard, 300);
            }
        });

        // ==========================================
        // ĐĂNG NHẬP BẰNG EMAIL/PASSWORD
        // ==========================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            isLoggingIn = true; // 🔒 Đặt cờ
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const remember = rememberCheckbox.checked;

            if (!email || !password) {
                showError('Vui lòng nhập đầy đủ email và mật khẩu');
                isLoggingIn = false;
                return;
            }

            // Hiển thị loading
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<span class="loading-spinner"></span> Đang đăng nhập...';

            try {
                // Set persistence (ghi nhớ đăng nhập)
                await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
                
                // Đăng nhập
                await signInWithEmailAndPassword(auth, email, password);
                
                console.log("✅ Đăng nhập thành công");
                
                // Xóa cờ "đã redirect" để lần sau vào dashboard bình thường
                sessionStorage.removeItem('redirected_to_dashboard');
                
                // Chuyển trang
                goToDashboard();
                
            } catch (error) {
                console.error("Lỗi đăng nhập:", error);
                isLoggingIn = false;
                btnLogin.disabled = false;
                btnLogin.innerHTML = '🔓 Đăng nhập';

                // Dịch lỗi sang tiếng Việt
                let msg = 'Đăng nhập thất bại';
                switch (error.code) {
                    case 'auth/user-not-found':
                        msg = 'Email không tồn tại trong hệ thống'; break;
                    case 'auth/wrong-password':
                    case 'auth/invalid-credential':
                        msg = 'Email hoặc mật khẩu không đúng'; break;
                    case 'auth/invalid-email':
                        msg = 'Email không hợp lệ'; break;
                    case 'auth/too-many-requests':
                        msg = 'Quá nhiều lần thử. Vui lòng thử lại sau'; break;
                    case 'auth/network-request-failed':
                        msg = 'Lỗi kết nối mạng. Vui lòng kiểm tra internet'; break;
                    default:
                        msg = error.message;
                }
                showError(msg);
            }
        });

        // ==========================================
        // ĐĂNG NHẬP BẰNG GOOGLE
        // ==========================================
        btnGoogle.addEventListener('click', async () => {
            isLoggingIn = true;
            btnGoogle.disabled = true;
            btnGoogle.innerHTML = '<span class="loading-spinner" style="border-top-color:#2341cc;border-color:rgba(35,65,204,0.3);border-top-color:#2341cc"></span> Đang xử lý...';

            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, googleProvider);
                
                console.log("✅ Đăng nhập Google thành công");
                sessionStorage.removeItem('redirected_to_dashboard');
                goToDashboard();
                
            } catch (error) {
                console.error("Lỗi đăng nhập Google:", error);
                isLoggingIn = false;
                btnGoogle.disabled = false;
                btnGoogle.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> Đăng nhập với Google';

                if (error.code === 'auth/popup-closed-by-user') {
                    showError('Bạn đã đóng cửa sổ đăng nhập');
                } else if (error.code === 'auth/popup-blocked') {
                    showError('Trình duyệt đã chặn popup. Vui lòng cho phép popup');
                } else {
                    showError('Lỗi đăng nhập Google: ' + error.message);
                }
            }
        });
    </script>
</body>
</html>
