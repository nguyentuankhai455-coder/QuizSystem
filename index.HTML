<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - QuizSystem</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e4f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 45px 40px;
            max-width: 440px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-container h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 4px;
        }
        .auth-container h1 span {
            color: #3498db;
        }
        .auth-container .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #e0e6ed;
        }

        .auth-tabs button {
            flex: 1;
            padding: 13px;
            border: none;
            background: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            color: #7f8c8d;
        }

        .auth-tabs button.active {
            background: #3498db;
            color: white;
        }

        .auth-tabs button:hover:not(.active) {
            background: #f0f7ff;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: #fafcff;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
            background: white;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 6px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.3);
        }

        .btn-google {
            background: #db4437;
            color: white;
            margin-top: 10px;
        }
        .btn-google:hover {
            background: #c33d31;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(219, 68, 55, 0.3);
        }

        .auth-error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
            background: #fde8e8;
            padding: 10px;
            border-radius: 8px;
        }

        .auth-success {
            color: #27ae60;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
            background: #e8f5ed;
            padding: 10px;
            border-radius: 8px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #95a5a6;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e6ed;
        }
        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }

        .loading {
            display: none;
            text-align: center;
            padding: 10px;
            color: #3498db;
            font-weight: 600;
        }

        .loading.active {
            display: block;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 30px 20px;
            }
            .auth-container h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <h1>📝 <span>Quiz</span>System</h1>
    <p class="subtitle">Hệ thống thi trắc nghiệm trực tuyến</p>

    <div class="auth-tabs">
        <button class="active" onclick="switchTab('login')">🔑 Đăng nhập</button>
        <button onclick="switchTab('register')">📝 Đăng ký</button>
    </div>

    <!-- FORM ĐĂNG NHẬP -->
    <div id="loginForm" class="auth-form active">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="Nhập email của bạn">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="loginPassword" placeholder="Nhập mật khẩu">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">Đăng nhập</button>
        
        <div class="divider">hoặc</div>
        
        <button class="btn btn-google" onclick="handleGoogleLogin()">
            🔵 Đăng nhập với Google
        </button>
        
        <div id="loginError" class="auth-error"></div>
        <div id="loginSuccess" class="auth-success"></div>
        <div id="loginLoading" class="loading">⏳ Đang xử lý...</div>
    </div>

    <!-- FORM ĐĂNG KÝ -->
    <div id="registerForm" class="auth-form">
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" id="regFullname" placeholder="Nhập họ tên của bạn">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="Nhập email của bạn">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="regPassword" placeholder="Tối thiểu 6 ký tự">
        </div>
        <div class="form-group">
            <label>Vai trò</label>
            <select id="regRole">
                <option value="teacher">👨‍🏫 Giáo viên</option>
                <option value="student">👨‍🎓 Học sinh</option>
            </select>
        </div>
        <button class="btn btn-success" onclick="handleRegister()">Đăng ký</button>
        <div id="registerError" class="auth-error"></div>
        <div id="registerSuccess" class="auth-success"></div>
        <div id="registerLoading" class="loading">⏳ Đang xử lý...</div>
    </div>
</div>

<script>
    // ============================================================
    // CẤU HÌNH FIREBASE
    // ============================================================
    
    const firebaseConfig = {
        apiKey: "AIzaSyAF2LoIaOiM666hS7iqI5dLvdDZcgBis-k",
        authDomain: "quizsystem-1d1c2.firebaseapp.com",
        projectId: "quizsystem-1d1c2",
        storageBucket: "quizsystem-1d1c2.firebasestorage.app",
        messagingSenderId: "435483557148",
        appId: "1:435483557148:web:bde77e8d41f46009518ed9",
        measurementId: "G-FS5YZWPDD9"
    };

    // Khởi tạo Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Cấu hình Google Provider
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // ============================================================
    // XỬ LÝ UI
    // ============================================================

    function switchTab(tab) {
        document.querySelectorAll('.auth-tabs button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        
        if (tab === 'login') {
            document.querySelector('.auth-tabs button:first-child').classList.add('active');
            document.getElementById('loginForm').classList.add('active');
        } else {
            document.querySelector('.auth-tabs button:last-child').classList.add('active');
            document.getElementById('registerForm').classList.add('active');
        }
        
        document.querySelectorAll('.auth-error, .auth-success').forEach(el => {
            el.style.display = 'none';
        });
        document.querySelectorAll('.loading').forEach(el => el.classList.remove('active'));
    }

    function showError(elementId, message) {
        const el = document.getElementById(elementId);
        el.textContent = '⚠️ ' + message;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    function showSuccess(elementId, message) {
        const el = document.getElementById(elementId);
        el.textContent = '✅ ' + message;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    function setLoading(loadingId, show) {
        document.getElementById(loadingId).classList.toggle('active', show);
    }

    // ============================================================
    // ĐĂNG KÝ VỚI FIREBASE
    // ============================================================

    async function handleRegister() {
        const fullname = document.getElementById('regFullname').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const role = document.getElementById('regRole').value;

        if (!fullname || !email || !password) {
            showError('registerError', 'Vui lòng điền đầy đủ thông tin!');
            return;
        }

        if (password.length < 6) {
            showError('registerError', 'Mật khẩu phải có ít nhất 6 ký tự!');
            return;
        }

        setLoading('registerLoading', true);
        document.getElementById('registerError').style.display = 'none';
        document.getElementById('registerSuccess').style.display = 'none';

        try {
            // Tạo tài khoản Firebase Auth
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;

            // Cập nhật profile
            await user.updateProfile({
                displayName: fullname
            });

            // Lưu thông tin vào Firestore
            await db.collection('users').doc(user.uid).set({
                fullname: fullname,
                email: email,
                role: role,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            showSuccess('registerSuccess', 'Đăng ký thành công! Đang chuyển hướng...');
            
            // Lưu thông tin vào localStorage để dashboard nhận biết
            localStorage.setItem('quizCurrentUser', JSON.stringify({
                uid: user.uid,
                fullname: fullname,
                email: email,
                role: role
            }));

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);

        } catch (error) {
            console.error('Lỗi đăng ký:', error);
            let message = 'Đăng ký thất bại. Vui lòng thử lại!';
            if (error.code === 'auth/email-already-in-use') {
                message = 'Email này đã được đăng ký!';
            } else if (error.code === 'auth/invalid-email') {
                message = 'Email không hợp lệ!';
            }
            showError('registerError', message);
        } finally {
            setLoading('registerLoading', false);
        }
    }

    // ============================================================
    // ĐĂNG NHẬP VỚI FIREBASE
    // ============================================================

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();

        if (!email || !password) {
            showError('loginError', 'Vui lòng nhập email và mật khẩu!');
            return;
        }

        setLoading('loginLoading', true);
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('loginSuccess').style.display = 'none';

        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const user = userCredential.user;

            // Lấy thông tin role từ Firestore
            const doc = await db.collection('users').doc(user.uid).get();
            const userData = doc.data();

            if (!userData) {
                throw new Error('Không tìm thấy thông tin người dùng!');
            }

            // Lưu vào localStorage
            localStorage.setItem('quizCurrentUser', JSON.stringify({
                uid: user.uid,
                fullname: userData.fullname || user.displayName || email,
                email: email,
                role: userData.role || 'student'
            }));

            showSuccess('loginSuccess', 'Đăng nhập thành công! Đang chuyển hướng...');

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);

        } catch (error) {
            console.error('Lỗi đăng nhập:', error);
            let message = 'Sai email hoặc mật khẩu!';
            if (error.code === 'auth/user-not-found') {
                message = 'Tài khoản không tồn tại!';
            } else if (error.code === 'auth/wrong-password') {
                message = 'Sai mật khẩu!';
            } else if (error.code === 'auth/invalid-email') {
                message = 'Email không hợp lệ!';
            } else if (error.code === 'auth/too-many-requests') {
                message = 'Quá nhiều lần thử, vui lòng thử lại sau!';
            }
            showError('loginError', message);
        } finally {
            setLoading('loginLoading', false);
        }
    }

    // ============================================================
    // ĐĂNG NHẬP VỚI GOOGLE
    // ============================================================

    async function handleGoogleLogin() {
        setLoading('loginLoading', true);
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('loginSuccess').style.display = 'none';

        try {
            const result = await auth.signInWithPopup(googleProvider);
            const user = result.user;

            // Kiểm tra xem user đã có trong Firestore chưa
            const doc = await db.collection('users').doc(user.uid).get();
            
            let userData = doc.data();
            let role = 'student'; // Mặc định

            if (userData) {
                role = userData.role || 'student';
            } else {
                // Nếu chưa có, tạo mới với role mặc định
                await db.collection('users').doc(user.uid).set({
                    fullname: user.displayName || 'Người dùng Google',
                    email: user.email,
                    role: 'student',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            localStorage.setItem('quizCurrentUser', JSON.stringify({
                uid: user.uid,
                fullname: user.displayName || 'Người dùng Google',
                email: user.email,
                role: role
            }));

            showSuccess('loginSuccess', 'Đăng nhập thành công! Đang chuyển hướng...');

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);

        } catch (error) {
            console.error('Lỗi đăng nhập Google:', error);
            if (error.code !== 'auth/popup-closed-by-user') {
                showError('loginError', 'Đăng nhập Google thất bại! Vui lòng thử lại.');
            }
        } finally {
            setLoading('loginLoading', false);
        }
    }

    // ============================================================
    // THEO DÕI TRẠNG THÁI ĐĂNG NHẬP
    // ============================================================

    auth.onAuthStateChanged((user) => {
        if (user) {
            // Nếu đã đăng nhập và đang ở trang index, chuyển sang dashboard
            const currentUser = localStorage.getItem('quizCurrentUser');
            if (!currentUser) {
                // Nếu chưa có trong localStorage, lấy từ Firestore
                db.collection('users').doc(user.uid).get().then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        localStorage.setItem('quizCurrentUser', JSON.stringify({
                            uid: user.uid,
                            fullname: data.fullname || user.displayName,
                            email: user.email,
                            role: data.role || 'student'
                        }));
                    }
                    window.location.href = 'dashboard.html';
                }).catch(() => {
                    window.location.href = 'dashboard.html';
                });
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    });

    // Enter để submit
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            if (document.getElementById('loginForm').classList.contains('active')) {
                handleLogin();
            } else if (document.getElementById('registerForm').classList.contains('active')) {
                handleRegister();
            }
        }
    });

    // Kiểm tra đã đăng nhập chưa
    const savedUser = localStorage.getItem('quizCurrentUser');
    if (savedUser) {
        // Chuyển thẳng vào dashboard nếu đã có token
        window.location.href = 'dashboard.html';
    }
</script>

</body>
</html>
