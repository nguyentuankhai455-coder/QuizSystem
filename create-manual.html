<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tự soạn đề - QuizSystem</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        .top-header {
            background: white;
            padding: 12px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-header .logo {
            font-size: 22px;
            font-weight: 800;
            color: #2c3e50;
            cursor: pointer;
        }
        .top-header .logo span {
            color: #3498db;
        }

        .top-header .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-header .header-right .user-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .top-header .header-right .badge-role {
            background: #e8f4fd;
            color: #2980b9;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background: #229954;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }
        .btn-warning:hover {
            background: #d68910;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 24px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .breadcrumb span {
            cursor: pointer;
            transition: color 0.3s;
        }
        .breadcrumb span:hover {
            color: #3498db;
        }
        .breadcrumb .current {
            color: #2c3e50;
            font-weight: 600;
            cursor: default;
        }
        .breadcrumb .sep {
            color: #b0b8c4;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .page-header h2 {
            color: #2c3e50;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .question-card {
            background: #f8faff;
            border: 2px solid #e8edf5;
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 12px;
        }

        .question-card .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .question-card .q-header .q-number {
            font-weight: 700;
            color: #2c3e50;
            font-size: 14px;
        }

        .question-card .q-header .btn-remove {
            background: #fee2e2;
            border: none;
            color: #dc2626;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .question-card .q-header .btn-remove:hover {
            background: #fecaca;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .options-grid input {
            padding: 8px 10px;
            border: 2px solid #e0e6ed;
            border-radius: 6px;
            font-size: 13px;
        }

        .options-grid input:focus {
            outline: none;
            border-color: #3498db;
        }

        .question-card select {
            padding: 8px 12px;
            border: 2px solid #e0e6ed;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 8px;
            background: white;
            width: 140px;
        }

        .flex {
            display: flex;
        }
        .gap-10 {
            gap: 10px;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
        .mt-16 {
            margin-top: 16px;
        }

        .loading-text {
            display: none;
            color: #3498db;
            margin-top: 8px;
        }
        .loading-text.show {
            display: block;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin: 12px 0;
        }

        .template-btn {
            padding: 10px;
            border: 2px dashed #d0d7e6;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .template-btn:hover {
            border-color: #3498db;
            background: #f0f7ff;
            transform: translateY(-2px);
        }

        .template-btn strong {
            display: block;
            color: #2c3e50;
            font-size: 14px;
        }

        .template-btn small {
            color: #7f8c8d;
            font-size: 11px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .top-header {
                padding: 10px 16px;
            }
            .container {
                padding: 10px 16px;
            }
            .page-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo" onclick="window.location.href='dashboard.html'">📝 <span>Quiz</span>System</div>
        <div class="header-right">
            <span class="user-name" id="userDisplayName">👋 User</span>
            <span class="badge-role" id="userRoleBadge">Giáo viên</span>
            <button class="btn btn-danger" onclick="handleLogout()">🚪 Đăng xuất</button>
        </div>
    </header>

    <div class="container">

        <!-- BREADCRUMB -->
        <div class="breadcrumb">
            <span onclick="window.location.href='dashboard.html'">Trang chủ</span>
            <span class="sep">›</span>
            <span onclick="window.location.href='exams.html'">Đề thi</span>
            <span class="sep">›</span>
            <span onclick="window.location.href='create-exam.html'">Tạo đề mới</span>
            <span class="sep">›</span>
            <span class="current">✏️ Tự soạn đề</span>
        </div>

        <!-- PAGE HEADER -->
        <div class="page-header">
            <h2>✏️ Tự soạn Đề thi / Bài tập</h2>
            <div>
                <button class="btn btn-secondary" onclick="window.location.href='create-exam.html'">
                    <i class="fas fa-arrow-left"></i> Quay lại
                </button>
            </div>
        </div>

        <!-- TEMPLATE MẪU -->
        <div style="margin-bottom:16px;">
            <h3 style="color:#2c3e50; margin-bottom:8px; font-size:14px;">📌 Chọn mẫu đề có sẵn:</h3>
            <div class="template-grid">
                <div class="template-btn" onclick="loadTemplate('toan')"><strong>🧮 Toán</strong><small>5 câu</small></div>
                <div class="template-btn" onclick="loadTemplate('van')"><strong>📖 Văn</strong><small>5 câu</small></div>
                <div class="template-btn" onclick="loadTemplate('anh')"><strong>🇬🇧 Anh</strong><small>5 câu</small></div>
                <div class="template-btn" onclick="loadTemplate('tin')"><strong>💻 Tin</strong><small>5 câu</small></div>
            </div>
        </div>

        <!-- FORM -->
        <div style="border-top:2px solid #e8edf5; padding-top:16px;">
            <div class="form-row">
                <div class="form-group">
                    <label>Tiêu đề đề thi *</label>
                    <input type="text" id="examTitle" placeholder="VD: Đề kiểm tra Toán 15 phút">
                </div>
                <div class="form-group">
                    <label>Thời gian (phút)</label>
                    <input type="number" id="examDuration" value="15" min="1">
                </div>
            </div>

            <div id="questionsContainer"></div>

            <div class="flex gap-10 flex-wrap mt-16">
                <button class="btn btn-primary" onclick="addQuestion()">➕ Thêm câu hỏi</button>
                <button class="btn btn-success" onclick="saveExam()">💾 Lưu đề thi</button>
                <button class="btn btn-secondary" onclick="clearForm()">🔄 Xóa form</button>
            </div>
            <div id="saveLoading" class="loading-text">⏳ Đang lưu...</div>
        </div>

    </div>

    <script>
        // ============================================================
        // FIREBASE
        // ============================================================

        const firebaseConfig = {
            apiKey: "AIzaSyAF2LoIaOiM666hS7iqI5dLvdDZcgBis-k",
            authDomain: "quizsystem-1d1c2.firebaseapp.com",
            projectId: "quizsystem-1d1c2",
            storageBucket: "quizsystem-1d1c2.firebasestorage.app",
            messagingSenderId: "435483557148",
            appId: "1:435483557148:web:bde77e8d41f46009518ed9",
            measurementId: "G-FS5YZWPDD9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // BIẾN TOÀN CỤ
        // ============================================================

        let currentUser = null;
        let questionCounter = 0;
        let currentEditingExamId = null;

        // ============================================================
        // AUTH
        // ============================================================

        function checkAuth() {
            const saved = localStorage.getItem('quizCurrentUser');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }
            try {
                currentUser = JSON.parse(saved);
            } catch (e) {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('userDisplayName').textContent = '👋 ' + (currentUser.fullname || currentUser.email);
            const roleLabel = currentUser.role === 'teacher' ? '👨‍🏫 Giáo viên' : '👨‍🎓 Học sinh';
            document.getElementById('userRoleBadge').textContent = roleLabel;

            // Kiểm tra template từ localStorage
            const templateData = localStorage.getItem('templateData');
            if (templateData) {
                try {
                    const tpl = JSON.parse(templateData);
                    document.getElementById('examTitle').value = tpl.title;
                    document.getElementById('examDuration').value = tpl.duration;

                    const container = document.getElementById('questionsContainer');
                    container.innerHTML = '';
                    tpl.questions.forEach((q, idx) => {
                        addQuestionWithData(idx, q.content, q.options, q.correct);
                    });
                    localStorage.removeItem('templateData');
                } catch (e) {}
            }

            // Kiểm tra sửa đề
            const editingId = localStorage.getItem('editingExamId');
            if (editingId) {
                loadExamForEdit(editingId);
            }

            // Tạo câu hỏi mặc định
            setTimeout(() => {
                const container = document.getElementById('questionsContainer');
                if (container.children.length === 0) {
                    addQuestion();
                }
            }, 300);
        }

        function handleLogout() {
            if (!confirm('Bạn muốn đăng xuất?')) return;
            auth.signOut().then(() => {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            }).catch(() => {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            });
        }

        // ============================================================
        // LOAD EXAM FOR EDIT
        // ============================================================

        async function loadExamForEdit(examId) {
            try {
                const doc = await db.collection('exams').doc(examId).get();
                if (doc.exists) {
                    const exam = { id: doc.id, ...doc.data() };
                    currentEditingExamId = examId;

                    document.getElementById('examTitle').value = exam.title;
                    document.getElementById('examDuration').value = exam.duration;

                    const container = document.getElementById('questionsContainer');
                    container.innerHTML = '';

                    if (exam.questions) {
                        exam.questions.forEach((q, i) => {
                            addQuestionWithData(i, q.content, q.options, q.correct);
                        });
                    }

                    // Thêm nút cập nhật
                    const oldBtn = document.querySelector('.btn-update-exam');
                    if (oldBtn) oldBtn.remove();

                    const btn = document.createElement('button');
                    btn.className = 'btn btn-warning btn-update-exam';
                    btn.textContent = '🔄 Cập nhật đề thi';
                    btn.onclick = saveExam;
                    document.querySelector('.flex.gap-10').appendChild(btn);

                    localStorage.removeItem('editingExamId');
                }
            } catch (error) {
                console.error('Lỗi tải đề để sửa:', error);
            }
        }

        // ============================================================
        // TEMPLATES
        // ============================================================

        const TEMPLATES = {
            toan: {
                title: 'Đề Toán cơ bản',
                duration: 15,
                questions: [
                    { content: '1 + 1 = ?', options: ['1', '2', '3', '4'], correct: 1 },
                    { content: '2 × 3 = ?', options: ['4', '5', '6', '7'], correct: 2 },
                    { content: '10 : 2 = ?', options: ['3', '4', '5', '6'], correct: 2 },
                    { content: 'Căn bậc hai của 16 là?', options: ['2', '4', '6', '8'], correct: 1 },
                    { content: 'Số nguyên tố nhỏ nhất là?', options: ['0', '1', '2', '3'], correct: 2 }
                ]
            },
            van: {
                title: 'Đề Văn học cơ bản',
                duration: 15,
                questions: [
                    { content: 'Tác giả của "Truyện Kiều" là ai?', options: ['Nguyễn Du', 'Hồ Xuân Hương', 'Nguyễn Đình Chiểu', 'Tố Hữu'], correct: 0 },
                    { content: 'Thể thơ "Lục bát" có số chữ mỗi câu là?', options: ['6-8', '7-7', '5-7', '8-6'], correct: 0 },
                    { content: 'Tác phẩm nào sau đây thuộc văn học trung đại?', options: ['Số đỏ', 'Chí Phèo', 'Nhật ký trong tù', 'Tắt đèn'], correct: 2 },
                    { content: 'Tác giả của bài thơ "Đồng chí" là?', options: ['Chính Hữu', 'Tố Hữu', 'Huy Cận', 'Xuân Diệu'], correct: 0 },
                    { content: 'Truyện "Thánh Gióng" thuộc thể loại gì?', options: ['Truyền thuyết', 'Cổ tích', 'Ngụ ngôn', 'Truyện cười'], correct: 0 }
                ]
            },
            anh: {
                title: 'Đề Tiếng Anh cơ bản',
                duration: 15,
                questions: [
                    { content: '"Hello" có nghĩa là gì?', options: ['Chào', 'Tạm biệt', 'Cảm ơn', 'Xin lỗi'], correct: 0 },
                    { content: 'Số "twenty" là số mấy?', options: ['12', '20', '22', '2'], correct: 1 },
                    { content: 'Màu "blue" là màu gì?', options: ['Đỏ', 'Vàng', 'Xanh dương', 'Trắng'], correct: 2 },
                    { content: '"Dog" là con gì?', options: ['Mèo', 'Chó', 'Gà', 'Vịt'], correct: 1 },
                    { content: '"Goodbye" có nghĩa là?', options: ['Chào', 'Cảm ơn', 'Tạm biệt', 'Xin chào'], correct: 2 }
                ]
            },
            tin: {
                title: 'Đề Tin học cơ bản',
                duration: 15,
                questions: [
                    { content: 'CPU là viết tắt của từ gì?', options: ['Central Processing Unit', 'Computer Personal Unit', 'Core Processing Unit', 'Central Program Unit'], correct: 0 },
                    { content: 'Đơn vị đo dung lượng nào lớn hơn 1 GB?', options: ['MB', 'KB', 'TB', 'B'], correct: 2 },
                    { content: 'Hệ điều hành nào sau đây là mã nguồn mở?', options: ['Windows', 'Linux', 'macOS', 'iOS'], correct: 1 },
                    { content: 'Phím tắt "Ctrl+C" dùng để làm gì?', options: ['Dán', 'Sao chép', 'Cắt', 'Lưu'], correct: 1 },
                    { content: 'WWW là viết tắt của?', options: ['World Wide Web', 'World Wide Work', 'Web World Wide', 'Wide World Web'], correct: 0 }
                ]
            }
        };

        function loadTemplate(templateKey) {
            const tpl = TEMPLATES[templateKey];
            if (!tpl) return;

            document.getElementById('examTitle').value = tpl.title;
            document.getElementById('examDuration').value = tpl.duration;

            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            tpl.questions.forEach((q, idx) => {
                addQuestionWithData(idx, q.content, q.options, q.correct);
            });

            const oldBtn = document.querySelector('.btn-update-exam');
            if (oldBtn) oldBtn.remove();
            currentEditingExamId = null;
        }

        // ============================================================
        // QUESTION MANAGEMENT
        // ============================================================

        function addQuestion() {
            addQuestionWithData(questionCounter, '', ['', '', '', ''], 0);
            questionCounter++;
        }

        function addQuestionWithData(id, content, options, correct) {
            const container = document.getElementById('questionsContainer');
            const div = document.createElement('div');
            div.className = 'question-card';
            div.dataset.qid = id;

            const optionLetters = ['A', 'B', 'C', 'D'];
            let optionsHTML = '';
            for (let i = 0; i < 4; i++) {
                optionsHTML += `
                    <input type="text" placeholder="Đáp án ${optionLetters[i]}" 
                           value="${options[i] || ''}" 
                           data-opt="${i}">
                `;
            }

            div.innerHTML = `
                <div class="q-header">
                    <span class="q-number">Câu hỏi ${container.children.length + 1}</span>
                    <button class="btn-remove" onclick="removeQuestion(this)">✕ Xóa</button>
                </div>
                <textarea rows="2" placeholder="Nội dung câu hỏi..." style="width:100%; padding:8px 12px; border:2px solid #e0e6ed; border-radius:6px; font-size:14px;">${content}</textarea>
                <div class="options-grid">
                    ${optionsHTML}
                </div>
                <div>
                    <label style="font-size:13px; font-weight:600; color:#34495e; margin-right:10px;">Đáp án đúng:</label>
                    <select>
                        ${optionLetters.map((l, i) => `<option value="${i}" ${i === correct ? 'selected' : ''}>${l}</option>`).join('')}
                    </select>
                </div>
            `;

            container.appendChild(div);
        }

        function removeQuestion(btn) {
            const card = btn.closest('.question-card');
            if (document.querySelectorAll('.question-card').length <= 1) {
                alert('Phải có ít nhất 1 câu hỏi!');
                return;
            }
            card.remove();
            document.querySelectorAll('.question-card .q-number').forEach((el, idx) => {
                el.textContent = `Câu hỏi ${idx + 1}`;
            });
        }

        function clearForm() {
            document.getElementById('examTitle').value = '';
            document.getElementById('examDuration').value = '15';
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            questionCounter = 0;
            addQuestion();
            const oldBtn = document.querySelector('.btn-update-exam');
            if (oldBtn) oldBtn.remove();
            currentEditingExamId = null;
        }

        // ============================================================
        // SAVE EXAM
        // ============================================================

        function getExamDataFromForm() {
            const title = document.getElementById('examTitle').value.trim();
            if (!title) { alert('Vui lòng nhập tiêu đề đề thi!'); return null; }

            const duration = parseInt(document.getElementById('examDuration').value) || 15;
            const questionCards = document.querySelectorAll('.question-card');

            if (questionCards.length === 0) {
                alert('Vui lòng thêm ít nhất 1 câu hỏi!');
                return null;
            }

            const questions = [];
            let valid = true;

            questionCards.forEach((card) => {
                const content = card.querySelector('textarea').value.trim();
                if (!content) { valid = false; return; }

                const optInputs = card.querySelectorAll('[data-opt]');
                const options = [];
                optInputs.forEach(inp => {
                    if (!inp.value.trim()) { valid = false; }
                    options.push(inp.value.trim());
                });

                const correct = parseInt(card.querySelector('select').value);
                questions.push({ content, options, correct });
            });

            if (!valid) {
                alert('Vui lòng điền đầy đủ nội dung câu hỏi và các đáp án!');
                return null;
            }

            return { title, duration, questions };
        }

        async function saveExam() {
            const examData = getExamDataFromForm();
            if (!examData) return;

            const loadingEl = document.getElementById('saveLoading');
            loadingEl.classList.add('show');

            try {
                if (currentEditingExamId) {
                    await db.collection('exams').doc(currentEditingExamId).update({
                        ...examData,
                        updatedAt: new Date().toLocaleString()
                    });
                    alert('✅ Đã cập nhật đề thi!');
                } else {
                    await db.collection('exams').add({
                        ...examData,
                        createdBy: currentUser.uid,
                        createdByEmail: currentUser.email,
                        createdAt: new Date().toLocaleString(),
                        status: 'Đã xuất bản'
                    });
                    alert('✅ Đã lưu đề thi thành công!');
                }

                clearForm();
                const oldBtn = document.querySelector('.btn-update-exam');
                if (oldBtn) oldBtn.remove();
                currentEditingExamId = null;
                questionCounter = 0;
                addQuestion();

                setTimeout(() => {
                    window.location.href = 'exams.html';
                }, 1500);

            } catch (error) {
                console.error('Lỗi lưu đề:', error);
                alert('Không thể lưu đề thi!');
            } finally {
                loadingEl.classList.remove('show');
            }
        }

        // ============================================================
        // INIT
        // ============================================================

        auth.onAuthStateChanged((user) => {
            if (!user) {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            }
        });

        checkAuth();
    </script>

</body>
</html>
