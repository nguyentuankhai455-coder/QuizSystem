<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề thi - QuizSystem</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        .top-header {
            background: white;
            padding: 12px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-header .logo {
            font-size: 22px;
            font-weight: 800;
            color: #2c3e50;
            cursor: pointer;
        }
        .top-header .logo span {
            color: #3498db;
        }

        .top-header .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-header .header-right .user-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .top-header .header-right .badge-role {
            background: #e8f4fd;
            color: #2980b9;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background: #229954;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #3498db;
            color: #3498db;
        }
        .btn-outline:hover {
            background: #3498db;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 24px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .breadcrumb span {
            cursor: pointer;
            transition: color 0.3s;
        }
        .breadcrumb span:hover {
            color: #3498db;
        }
        .breadcrumb .current {
            color: #2c3e50;
            font-weight: 600;
            cursor: default;
        }
        .breadcrumb .sep {
            color: #b0b8c4;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .page-header h2 {
            color: #2c3e50;
            font-size: 20px;
        }

        .page-header .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 180px;
            padding: 10px 16px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3498db;
        }

        .exam-grid {
            display: grid;
            gap: 12px;
        }

        .exam-item {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.3s;
            border-left: 4px solid #27ae60;
        }

        .exam-item:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .exam-item .exam-info h4 {
            color: #2c3e50;
            font-size: 15px;
        }

        .exam-item .exam-info p {
            color: #7f8c8d;
            font-size: 13px;
            margin-top: 3px;
        }

        .exam-item .exam-info .tags {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .exam-item .exam-info .tags .tag {
            background: #e8edf5;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #2c3e50;
        }

        .exam-item .exam-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .no-exams {
            text-align: center;
            padding: 50px 20px;
            color: #95a5a6;
            background: white;
            border-radius: 12px;
        }

        .no-exams .icon {
            font-size: 56px;
            margin-bottom: 12px;
            color: #d0d7e6;
        }

        .no-exams h4 {
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .no-exams p {
            color: #95a5a6;
            font-size: 14px;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #3498db;
        }

        .loading-spinner i {
            font-size: 32px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .top-header {
                padding: 10px 16px;
            }
            .container {
                padding: 10px 16px;
            }
            .exam-item {
                flex-direction: column;
                align-items: stretch;
            }
            .page-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo" onclick="window.location.href='dashboard.html'">📝 <span>Quiz</span>System</div>
        <div class="header-right">
            <span class="user-name" id="userDisplayName">👋 User</span>
            <span class="badge-role" id="userRoleBadge">Giáo viên</span>
            <button class="btn btn-danger" onclick="handleLogout()">🚪 Đăng xuất</button>
        </div>
    </header>

    <div class="container">

        <!-- BREADCRUMB -->
        <div class="breadcrumb">
            <span onclick="window.location.href='dashboard.html'">Trang chủ</span>
            <span class="sep">›</span>
            <span class="current">Đề thi</span>
        </div>

        <!-- PAGE HEADER -->
        <div class="page-header">
            <h2>📋 Đề thi</h2>
            <div class="actions">
                <button class="btn btn-primary" onclick="window.location.href='create-exam.html'">
                    <i class="fas fa-plus"></i> Tạo đề thi
                </button>
                <button class="btn btn-outline">
                    <i class="fas fa-folder"></i> Tạo thư mục
                </button>
            </div>
        </div>

        <!-- SEARCH -->
        <div class="search-box">
            <input type="text" id="searchExam" placeholder="🔍 Tìm kiếm đề thi..." oninput="filterExams()">
            <button class="btn btn-secondary" onclick="document.getElementById('searchExam').value=''; filterExams();">
                <i class="fas fa-times"></i> Xóa
            </button>
        </div>

        <!-- ĐỀ XUẤT -->
        <h3 style="color:#2c3e50; margin-bottom:10px; font-size:15px;">🌟 Được đề xuất</h3>
        <div id="suggestedExams" class="exam-grid"></div>

        <!-- TẤT CẢ -->
        <h3 style="color:#2c3e50; margin:20px 0 10px; font-size:15px;">📚 Tất cả đề thi</h3>
        <div id="allExams" class="exam-grid"></div>

        <!-- LOADING -->
        <div id="examLoading" class="loading-spinner" style="display:none;">
            <i class="fas fa-spinner"></i>
            <p style="margin-top:8px;">Đang tải đề thi...</p>
        </div>

    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================

        const firebaseConfig = {
            apiKey: "AIzaSyAF2LoIaOiM666hS7iqI5dLvdDZcgBis-k",
            authDomain: "quizsystem-1d1c2.firebaseapp.com",
            projectId: "quizsystem-1d1c2",
            storageBucket: "quizsystem-1d1c2.firebasestorage.app",
            messagingSenderId: "435483557148",
            appId: "1:435483557148:web:bde77e8d41f46009518ed9",
            measurementId: "G-FS5YZWPDD9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // BIẾN TOÀN CỤ
        // ============================================================

        let currentUser = null;
        let allExams = [];

        // ============================================================
        // AUTH
        // ============================================================

        function checkAuth() {
            const saved = localStorage.getItem('quizCurrentUser');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }
            try {
                currentUser = JSON.parse(saved);
            } catch (e) {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('userDisplayName').textContent = '👋 ' + (currentUser.fullname || currentUser.email);
            const roleLabel = currentUser.role === 'teacher' ? '👨‍🏫 Giáo viên' : '👨‍🎓 Học sinh';
            document.getElementById('userRoleBadge').textContent = roleLabel;

            // Load đề thi ngay khi vào trang
            loadExams();
        }

        function handleLogout() {
            if (!confirm('Bạn muốn đăng xuất?')) return;
            auth.signOut().then(() => {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            }).catch(() => {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            });
        }

        // ============================================================
        // LOAD EXAMS FROM FIRESTORE
        // ============================================================

        async function loadExams() {
            const loadingEl = document.getElementById('examLoading');
            loadingEl.style.display = 'block';

            try {
                // Lấy tất cả đề thi từ Firestore
                const snapshot = await db.collection('exams')
                    .orderBy('createdAt', 'desc')
                    .get();

                allExams = [];
                snapshot.forEach(doc => {
                    allExams.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                console.log('✅ Đã tải ' + allExams.length + ' đề thi từ Firebase');

                renderExams();

            } catch (error) {
                console.error('❌ Lỗi tải đề thi:', error);

                // Thử load từ cache nếu có
                const cached = localStorage.getItem('cachedExams');
                if (cached) {
                    try {
                        allExams = JSON.parse(cached);
                        renderExams();
                        console.log('📁 Đã tải từ cache');
                    } catch (e) {}
                } else {
                    // Hiển thị thông báo lỗi
                    document.getElementById('allExams').innerHTML = `
                        <div class="no-exams">
                            <div class="icon">⚠️</div>
                            <h4>Không thể tải dữ liệu</h4>
                            <p>Vui lòng kiểm tra kết nối Internet và thử lại.</p>
                            <button class="btn btn-primary" onclick="loadExams()" style="margin-top:12px;">
                                <i class="fas fa-sync"></i> Thử lại
                            </button>
                        </div>
                    `;
                }
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        // ============================================================
        // RENDER EXAMS
        // ============================================================

        function renderExams() {
            // Lưu cache
            localStorage.setItem('cachedExams', JSON.stringify(allExams));

            // Suggested (3 đề đầu tiên)
            const suggested = allExams.slice(0, 3);
            const container1 = document.getElementById('suggestedExams');

            if (suggested.length === 0) {
                container1.innerHTML = `
                    <div class="no-exams">
                        <div class="icon">📭</div>
                        <h4>Chưa có đề thi nào</h4>
                        <p>Hãy tạo đề thi đầu tiên của bạn!</p>
                    </div>
                `;
            } else {
                container1.innerHTML = suggested.map(exam => examHTML(exam)).join('');
            }

            // All exams
            const container2 = document.getElementById('allExams');

            if (allExams.length === 0) {
                container2.innerHTML = `
                    <div class="no-exams">
                        <div class="icon">📭</div>
                        <h4>Chưa có đề thi nào</h4>
                        <p>Nhấn nút <strong>"Tạo đề thi"</strong> để bắt đầu!</p>
                    </div>
                `;
            } else {
                container2.innerHTML = allExams.map(exam => examHTML(exam)).join('');
            }
        }

        // ============================================================
        // EXAM HTML
        // ============================================================

        function examHTML(exam) {
            const isTeacher = currentUser && currentUser.role === 'teacher';
            const questionCount = exam.questions ? exam.questions.length : 0;
            const createdDate = exam.createdAt || 'Mới tạo';

            return `
                <div class="exam-item" data-title="${(exam.title || '').toLowerCase()}">
                    <div class="exam-info">
                        <h4>📄 ${exam.title || 'Đề thi không tên'}</h4>
                        <p>⏱ ${exam.duration || 0} phút · ${questionCount} câu hỏi</p>
                        <div class="tags">
                            <span class="tag">📅 ${createdDate}</span>
                            ${exam.status ? `<span class="tag">${exam.status}</span>` : ''}
                        </div>
                    </div>
                    <div class="exam-actions">
                        ${isTeacher ? `
                            <button class="btn btn-primary btn-sm" onclick="editExam('${exam.id}')">
                                <i class="fas fa-edit"></i> Sửa
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteExam('${exam.id}')">
                                <i class="fas fa-trash"></i> Xóa
                            </button>
                        ` : ''}
                        <button class="btn btn-success btn-sm" onclick="viewExam('${exam.id}')">
                            <i class="fas fa-eye"></i> Xem
                        </button>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // ACTIONS
        // ============================================================

        function filterExams() {
            const keyword = document.getElementById('searchExam').value.toLowerCase();
            const items = document.querySelectorAll('#allExams .exam-item');
            let found = false;

            items.forEach(item => {
                const title = item.dataset.title || '';
                if (title.includes(keyword)) {
                    item.style.display = 'flex';
                    found = true;
                } else {
                    item.style.display = 'none';
                }
            });

            // Xóa thông báo no-result cũ
            const container = document.getElementById('allExams');
            const noResult = container.querySelector('.no-result');
            if (noResult) noResult.remove();

            // Nếu không tìm thấy gì
            if (!found && items.length > 0) {
                const div = document.createElement('div');
                div.className = 'no-exams no-result';
                div.innerHTML = `
                    <div class="icon">🔍</div>
                    <h4>Không tìm thấy đề thi</h4>
                    <p>Thử tìm kiếm với từ khóa khác</p>
                `;
                container.appendChild(div);
            }
        }

        async function deleteExam(examId) {
            if (!confirm('Bạn có chắc chắn muốn xóa đề thi này?')) return;

            try {
                await db.collection('exams').doc(examId).delete();

                // Xóa khỏi danh sách local
                allExams = allExams.filter(e => e.id !== examId);
                renderExams();

                alert('✅ Đã xóa đề thi thành công!');

            } catch (error) {
                console.error('Lỗi xóa đề thi:', error);
                alert('❌ Không thể xóa đề thi. Vui lòng thử lại!');
            }
        }

        function viewExam(examId) {
            const exam = allExams.find(e => e.id === examId);
            if (!exam) {
                alert('Không tìm thấy đề thi!');
                return;
            }

            const questionList = exam.questions ? exam.questions.map((q, i) => {
                const options = q.options ? q.options.map((opt, oi) =>
                    `    ${['A','B','C','D'][oi]}. ${opt}`
                ).join('\n') : '';
                return `Câu ${i+1}: ${q.content}\n${options}\nĐáp án: ${['A','B','C','D'][q.correct]}`;
            }).join('\n\n') : 'Không có câu hỏi';

            alert(`📄 ${exam.title}\n⏱ ${exam.duration} phút\n📝 ${exam.questions ? exam.questions.length : 0} câu hỏi\n\n${questionList}`);
        }

        function editExam(examId) {
            // Lưu ID vào localStorage để create-manual.html biết
            localStorage.setItem('editingExamId', examId);
            window.location.href = 'create-manual.html';
        }

        // ============================================================
        // INIT
        // ============================================================

        auth.onAuthStateChanged((user) => {
            if (!user) {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            }
        });

        // Khởi chạy
        checkAuth();
    </script>

</body>
</html>
