<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề thi - QuizSystem</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-header {
            background: white;
            padding: 12px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-header .logo {
            font-size: 22px;
            font-weight: 800;
            color: #2c3e50;
            cursor: pointer;
        }
        .top-header .logo span {
            color: #3498db;
        }

        .top-header .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-header .header-right .user-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .top-header .header-right .badge-role {
            background: #e8f4fd;
            color: #2980b9;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background: #229954;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #3498db;
            color: #3498db;
        }
        .btn-outline:hover {
            background: #3498db;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 24px;
            flex: 1;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .breadcrumb span {
            cursor: pointer;
            transition: color 0.3s;
        }
        .breadcrumb span:hover {
            color: #3498db;
        }
        .breadcrumb .current {
            color: #2c3e50;
            font-weight: 600;
            cursor: default;
        }
        .breadcrumb .sep {
            color: #b0b8c4;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .page-header h2 {
            color: #2c3e50;
            font-size: 20px;
        }

        .page-header .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 180px;
            padding: 10px 16px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3498db;
        }

        .exam-grid {
            display: grid;
            gap: 12px;
        }

        .exam-item {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.3s;
            border-left: 4px solid #27ae60;
        }

        .exam-item:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .exam-item .exam-info h4 {
            color: #2c3e50;
            font-size: 15px;
        }

        .exam-item .exam-info p {
            color: #7f8c8d;
            font-size: 13px;
            margin-top: 3px;
        }

        .exam-item .exam-info .tags {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .exam-item .exam-info .tags .tag {
            background: #e8edf5;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #2c3e50;
        }

        .exam-item .exam-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Folder styles */
        .folder-item {
            background: #f8faff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 4px solid #f39c12;
            cursor: pointer;
            transition: all 0.3s;
        }

        .folder-item:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            background: #fefefe;
        }

        .folder-item .folder-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .folder-item .folder-info .folder-icon {
            font-size: 24px;
            color: #f39c12;
        }

        .folder-item .folder-info h4 {
            color: #2c3e50;
            font-size: 15px;
        }

        .folder-item .folder-info p {
            color: #7f8c8d;
            font-size: 13px;
        }

        .folder-item .folder-actions {
            display: flex;
            gap: 6px;
        }

        .no-exams {
            text-align: center;
            padding: 50px 20px;
            color: #95a5a6;
            background: white;
            border-radius: 12px;
        }

        .no-exams .icon {
            font-size: 56px;
            margin-bottom: 12px;
            color: #d0d7e6;
        }

        .no-exams h4 {
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .no-exams p {
            color: #95a5a6;
            font-size: 14px;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #3498db;
        }

        .loading-spinner i {
            font-size: 32px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h3 {
            color: #2c3e50;
            margin-bottom: 16px;
        }

        .modal .form-group {
            margin-bottom: 14px;
        }

        .modal .form-group label {
            display: block;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .modal .form-group input:focus,
        .modal .form-group select:focus {
            outline: none;
            border-color: #3498db;
        }

        .modal .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        .modal .actions .btn {
            padding: 8px 24px;
        }

        .modal .folder-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e8edf5;
        }

        .modal .folder-header .folder-icon {
            font-size: 32px;
            color: #f39c12;
        }

        .modal .folder-header .folder-title {
            font-size: 20px;
            font-weight: 700;
            color: #2c3e50;
        }

        .modal .folder-header .folder-count {
            font-size: 13px;
            color: #95a5a6;
            margin-left: auto;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: white;
            padding: 16px 24px;
            border-top: 2px solid #e8edf5;
            text-align: center;
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 40px;
        }

        .footer .copyright {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .footer .copyright .heart {
            color: #e74c3c;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .footer .copyright .brand {
            color: #3498db;
            font-weight: 700;
        }

        .footer .copyright .version {
            background: #e8edf5;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #7f8c8d;
        }

        @media (max-width: 768px) {
            .top-header {
                padding: 10px 16px;
            }
            .container {
                padding: 10px 16px;
            }
            .exam-item {
                flex-direction: column;
                align-items: stretch;
            }
            .folder-item {
                flex-direction: column;
                align-items: stretch;
            }
            .page-header {
                flex-direction: column;
                align-items: stretch;
            }
            .footer {
                padding: 12px 16px;
                font-size: 12px;
            }
            .modal {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo" onclick="window.location.href='dashboard.html'">📝 <span>Quiz</span>System</div>
        <div class="header-right">
            <span class="user-name" id="userDisplayName">👋 User</span>
            <span class="badge-role" id="userRoleBadge">Giáo viên</span>
            <button class="btn btn-danger" onclick="handleLogout()">🚪 Đăng xuất</button>
        </div>
    </header>

    <div class="container">

        <div class="breadcrumb">
            <span onclick="window.location.href='dashboard.html'">Trang chủ</span>
            <span class="sep">›</span>
            <span class="current">Đề thi</span>
        </div>

        <div class="page-header">
            <h2>📋 Đề thi</h2>
            <div class="actions">
                <button class="btn btn-primary" onclick="window.location.href='create-exam.html'">
                    <i class="fas fa-plus"></i> Tạo đề thi
                </button>
                <button class="btn btn-outline" onclick="openCreateFolder()">
                    <i class="fas fa-folder"></i> Tạo thư mục
                </button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchExam" placeholder="🔍 Tìm kiếm đề thi..." oninput="filterExams()">
            <button class="btn btn-secondary" onclick="document.getElementById('searchExam').value=''; filterExams();">
                <i class="fas fa-times"></i> Xóa
            </button>
        </div>

        <!-- FOLDERS -->
        <h3 style="color:#2c3e50; margin-bottom:10px; font-size:15px;">📁 Thư mục</h3>
        <div id="folderList" class="exam-grid"></div>

        <!-- ĐỀ XUẤT -->
        <h3 style="color:#2c3e50; margin:20px 0 10px; font-size:15px;">🌟 Được đề xuất</h3>
        <div id="suggestedExams" class="exam-grid"></div>

        <!-- TẤT CẢ -->
        <h3 style="color:#2c3e50; margin:20px 0 10px; font-size:15px;">📚 Tất cả đề thi</h3>
        <div id="allExams" class="exam-grid"></div>

        <div id="examLoading" class="loading-spinner" style="display:none;">
            <i class="fas fa-spinner"></i>
            <p style="margin-top:8px;">Đang tải đề thi...</p>
        </div>

    </div>

    <!-- MODAL TẠO THƯ MỤC -->
    <div class="modal-overlay" id="folderModal">
        <div class="modal">
            <h3>📁 Tạo thư mục mới</h3>
            <div class="form-group">
                <label>Tên thư mục *</label>
                <input type="text" id="folderName" placeholder="Nhập tên thư mục...">
            </div>
            <div class="form-group">
                <label>Màu sắc</label>
                <select id="folderColor">
                    <option value="#f39c12">🟡 Vàng</option>
                    <option value="#3498db">🔵 Xanh dương</option>
                    <option value="#27ae60">🟢 Xanh lá</option>
                    <option value="#e74c3c">🔴 Đỏ</option>
                    <option value="#8e44ad">🟣 Tím</option>
                    <option value="#e67e22">🟠 Cam</option>
                </select>
            </div>
            <div class="actions">
                <button class="btn btn-secondary" onclick="closeCreateFolder()">Hủy</button>
                <button class="btn btn-success" onclick="createFolder()">✅ Tạo thư mục</button>
            </div>
        </div>
    </div>

    <!-- MODAL MỞ THƯ MỤC - HIỂN THỊ ĐỀ THI TRONG THƯ MỤC -->
    <div class="modal-overlay" id="openFolderModal">
        <div class="modal">
            <div class="folder-header">
                <div class="folder-icon" id="openFolderIcon"><i class="fas fa-folder" style="color:#f39c12;"></i></div>
                <div class="folder-title" id="openFolderTitle">Thư mục</div>
                <div class="folder-count" id="openFolderCount">0 đề thi</div>
                <button class="btn btn-secondary btn-sm" onclick="closeOpenFolder()">✕</button>
            </div>
            <div id="openFolderContent">
                <!-- Danh sách đề thi trong thư mục sẽ được render ở đây -->
            </div>
            <div class="actions">
                <button class="btn btn-secondary" onclick="closeOpenFolder()">Đóng</button>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="copyright">
            <span>© 2026</span>
            <span class="brand">QuizSystem</span>
            <span>·</span>
            <span>Made with</span>
            <span class="heart">❤️</span>
            <span>by</span>
            <span style="font-weight:600; color:#2c3e50;">Nguyễn Tuấn Khải</span>
            <span style="color:#95a5a6; font-size:12px;">DEV Dora Fanclub Việt Nam</span>
            <span class="version">v2.0.0</span>
        </div>
    </footer>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================

        const firebaseConfig = {
            apiKey: "AIzaSyAF2LoIaOiM666hS7iqI5dLvdDZcgBis-k",
            authDomain: "quizsystem-1d1c2.firebaseapp.com",
            projectId: "quizsystem-1d1c2",
            storageBucket: "quizsystem-1d1c2.firebasestorage.app",
            messagingSenderId: "435483557148",
            appId: "1:435483557148:web:bde77e8d41f46009518ed9",
            measurementId: "G-FS5YZWPDD9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // BIẾN TOÀN CỤ
        // ============================================================

        let currentUser = null;
        let allExams = [];
        let allFolders = [];
        let currentFolderExams = [];

        // ============================================================
        // AUTH
        // ============================================================

        function checkAuth() {
            const saved = localStorage.getItem('quizCurrentUser');
            if (!saved) {
                window.location.href = 'index.html';
                return;
            }
            try {
                currentUser = JSON.parse(saved);
            } catch (e) {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('userDisplayName').textContent = '👋 ' + (currentUser.fullname || currentUser.email);
            const roleLabel = currentUser.role === 'teacher' ? '👨‍🏫 Giáo viên' : '👨‍🎓 Học sinh';
            document.getElementById('userRoleBadge').textContent = roleLabel;

            loadFolders();
            loadExams();
        }

        function handleLogout() {
            if (!confirm('Bạn muốn đăng xuất?')) return;
            auth.signOut().then(() => {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            }).catch(() => {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            });
        }

        // ============================================================
        // LOAD FOLDERS
        // ============================================================

        async function loadFolders() {
            console.log('🔄 Đang tải thư mục...');

            try {
                const snapshot = await db.collection('folders')
                    .where('createdBy', '==', currentUser.uid)
                    .get();

                allFolders = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allFolders.push({
                        id: doc.id,
                        ...data
                    });
                });

                allFolders.sort((a, b) => {
                    const dateA = a.createdAt || '';
                    const dateB = b.createdAt || '';
                    return dateB.localeCompare(dateA);
                });

                console.log('✅ Đã tải ' + allFolders.length + ' thư mục');
                renderFolders();

            } catch (error) {
                console.error('❌ Lỗi tải thư mục:', error);
                renderFolders();
            }
        }

        function renderFolders() {
            const container = document.getElementById('folderList');

            if (!allFolders || allFolders.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:20px; color:#95a5a6; background:white; border-radius:12px; border: 2px dashed #d0d7e6;">
                        <p style="font-size:32px; margin-bottom:8px;">📭</p>
                        <p style="font-weight:600; color:#2c3e50;">Chưa có thư mục nào</p>
                        <p style="font-size:13px; margin-top:4px;">Nhấn <strong>"Tạo thư mục"</strong> để sắp xếp đề thi</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = allFolders.map(folder => `
                <div class="folder-item" onclick="openFolder('${folder.id}')">
                    <div class="folder-info">
                        <div class="folder-icon"><i class="fas fa-folder" style="color:${folder.color || '#f39c12'};"></i></div>
                        <div>
                            <h4>📁 ${folder.name}</h4>
                            <p>${folder.examCount || 0} đề thi · ${folder.createdAt || 'Mới tạo'}</p>
                        </div>
                    </div>
                    <div class="folder-actions">
                        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deleteFolder('${folder.id}')">
                            <i class="fas fa-trash"></i> Xóa
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ============================================================
        // CRUD FOLDER
        // ============================================================

        function openCreateFolder() {
            document.getElementById('folderModal').classList.add('show');
            document.getElementById('folderName').value = '';
            document.getElementById('folderName').focus();
        }

        function closeCreateFolder() {
            document.getElementById('folderModal').classList.remove('show');
        }

        async function createFolder() {
            const name = document.getElementById('folderName').value.trim();
            const color = document.getElementById('folderColor').value;

            if (!name) {
                alert('⚠️ Vui lòng nhập tên thư mục!');
                return;
            }

            try {
                const docRef = await db.collection('folders').add({
                    name: name,
                    color: color,
                    examCount: 0,
                    createdBy: currentUser.uid,
                    createdByEmail: currentUser.email,
                    createdAt: new Date().toLocaleString()
                });

                closeCreateFolder();
                await loadFolders();
                alert('✅ Đã tạo thư mục thành công!');

            } catch (error) {
                console.error('❌ Lỗi tạo thư mục:', error);
                alert('❌ Không thể tạo thư mục! Lỗi: ' + error.message);
            }
        }

        async function deleteFolder(folderId) {
            if (!confirm('Bạn có chắc chắn muốn xóa thư mục này?')) return;

            try {
                await db.collection('folders').doc(folderId).delete();
                allFolders = allFolders.filter(f => f.id !== folderId);
                renderFolders();
                alert('✅ Đã xóa thư mục!');
            } catch (error) {
                console.error('❌ Lỗi xóa thư mục:', error);
                alert('❌ Không thể xóa thư mục!');
            }
        }

        // ============================================================
        // MỞ THƯ MỤC - HIỂN THỊ ĐỀ THI TRONG THƯ MỤC
        // ============================================================

        function openFolder(folderId) {
            const folder = allFolders.find(f => f.id === folderId);
            if (!folder) {
                alert('Không tìm thấy thư mục!');
                return;
            }

            // Lọc đề thi thuộc thư mục này
            // Giả định: đề thi có field folderId để biết thuộc thư mục nào
            // Nếu chưa có, hiển thị tất cả đề thi và cho phép thêm vào thư mục
            currentFolderExams = allExams.filter(exam => exam.folderId === folderId);

            // Hiển thị modal
            const modal = document.getElementById('openFolderModal');
            modal.classList.add('show');

            document.getElementById('openFolderIcon').innerHTML = `<i class="fas fa-folder" style="color:${folder.color || '#f39c12'};"></i>`;
            document.getElementById('openFolderTitle').textContent = folder.name;
            document.getElementById('openFolderCount').textContent = currentFolderExams.length + ' đề thi';

            renderFolderContent();
        }

        function renderFolderContent() {
            const container = document.getElementById('openFolderContent');

            if (currentFolderExams.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px; color:#95a5a6;">
                        <p style="font-size:48px; margin-bottom:12px;">📭</p>
                        <p style="font-weight:600; color:#2c3e50;">Chưa có đề thi trong thư mục này</p>
                        <p style="font-size:13px; margin-top:4px;">Kéo thả đề thi vào đây hoặc chọn "Thêm vào thư mục"</p>
                        <div style="margin-top:16px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
                            <button class="btn btn-primary btn-sm" onclick="addExamToFolder()">
                                <i class="fas fa-plus"></i> Thêm đề thi vào thư mục
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = currentFolderExams.map(exam => `
                <div class="exam-item" style="border-left-color: #f39c12;">
                    <div class="exam-info">
                        <h4>📄 ${exam.title || 'Đề thi không tên'}</h4>
                        <p>⏱ ${exam.duration || 0} phút · ${exam.questions ? exam.questions.length : 0} câu hỏi</p>
                        <div class="tags">
                            <span class="tag">📅 ${exam.createdAt || 'Mới tạo'}</span>
                            ${exam.status ? `<span class="tag">${exam.status}</span>` : ''}
                        </div>
                    </div>
                    <div class="exam-actions">
                        <button class="btn btn-danger btn-sm" onclick="removeExamFromFolder('${exam.id}')">
                            <i class="fas fa-times"></i> Xóa khỏi thư mục
                        </button>
                        <button class="btn btn-success btn-sm" onclick="viewExam('${exam.id}')">
                            <i class="fas fa-eye"></i> Xem
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function closeOpenFolder() {
            document.getElementById('openFolderModal').classList.remove('show');
        }

        // ============================================================
        // THÊM / XÓA ĐỀ THI VÀO THƯ MỤC
        // ============================================================

        function addExamToFolder() {
            // Lấy folderId từ modal hiện tại
            const folderId = allFolders.find(f => f.name === document.getElementById('openFolderTitle').textContent)?.id;
            if (!folderId) {
                alert('Không tìm thấy thư mục!');
                return;
            }

            // Lọc các đề thi chưa có trong thư mục
            const availableExams = allExams.filter(exam => exam.folderId !== folderId);

            if (availableExams.length === 0) {
                alert('📭 Tất cả đề thi đã có trong thư mục này!');
                return;
            }

            // Tạo danh sách chọn
            let options = availableExams.map((exam, idx) =>
                `${idx + 1}. ${exam.title || 'Đề thi không tên'}`
            ).join('\n');

            const choice = prompt(
                `📂 Chọn đề thi để thêm vào thư mục "${document.getElementById('openFolderTitle').textContent}":\n\n` +
                options +
                `\n\nNhập số thứ tự đề thi (ví dụ: 1) hoặc nhập 0 để hủy:`
            );

            if (!choice || choice === '0') return;

            const index = parseInt(choice) - 1;
            if (isNaN(index) || index < 0 || index >= availableExams.length) {
                alert('⚠️ Số thứ tự không hợp lệ!');
                return;
            }

            const selectedExam = availableExams[index];
            if (!selectedExam) return;

            // Cập nhật folderId cho đề thi
            db.collection('exams').doc(selectedExam.id).update({
                folderId: folderId
            }).then(() => {
                // Cập nhật local
                selectedExam.folderId = folderId;
                // Cập nhật số lượng đề thi trong thư mục
                const folder = allFolders.find(f => f.id === folderId);
                if (folder) {
                    folder.examCount = (folder.examCount || 0) + 1;
                    db.collection('folders').doc(folderId).update({
                        examCount: folder.examCount
                    });
                }
                // Reload
                loadFolders();
                loadExams();
                openFolder(folderId);
                alert('✅ Đã thêm đề thi vào thư mục!');
            }).catch(error => {
                console.error('Lỗi thêm đề thi vào thư mục:', error);
                alert('❌ Không thể thêm đề thi vào thư mục!');
            });
        }

        function removeExamFromFolder(examId) {
            if (!confirm('Bạn có chắc chắn muốn xóa đề thi này khỏi thư mục?')) return;

            const exam = allExams.find(e => e.id === examId);
            if (!exam) return;

            const folderId = exam.folderId;
            if (!folderId) return;

            db.collection('exams').doc(examId).update({
                folderId: null
            }).then(() => {
                delete exam.folderId;
                // Cập nhật số lượng
                const folder = allFolders.find(f => f.id === folderId);
                if (folder) {
                    folder.examCount = Math.max(0, (folder.examCount || 0) - 1);
                    db.collection('folders').doc(folderId).update({
                        examCount: folder.examCount
                    });
                }
                // Reload
                loadFolders();
                loadExams();
                const folderName = document.getElementById('openFolderTitle').textContent;
                const f = allFolders.find(f => f.name === folderName);
                if (f) {
                    openFolder(f.id);
                } else {
                    closeOpenFolder();
                }
                alert('✅ Đã xóa đề thi khỏi thư mục!');
            }).catch(error => {
                console.error('Lỗi xóa đề thi khỏi thư mục:', error);
                alert('❌ Không thể xóa đề thi khỏi thư mục!');
            });
        }

        // ============================================================
        // LOAD EXAMS
        // ============================================================

        async function loadExams() {
            const loadingEl = document.getElementById('examLoading');
            loadingEl.style.display = 'block';

            try {
                const snapshot = await db.collection('exams')
                    .orderBy('createdAt', 'desc')
                    .get();

                allExams = [];
                snapshot.forEach(doc => {
                    allExams.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                console.log('✅ Đã tải ' + allExams.length + ' đề thi');
                renderExams();

            } catch (error) {
                console.error('❌ Lỗi tải đề thi:', error);
                const cached = localStorage.getItem('cachedExams');
                if (cached) {
                    try {
                        allExams = JSON.parse(cached);
                        renderExams();
                    } catch (e) {}
                } else {
                    document.getElementById('allExams').innerHTML = `
                        <div class="no-exams">
                            <div class="icon">⚠️</div>
                            <h4>Không thể tải dữ liệu</h4>
                            <p>Vui lòng kiểm tra kết nối Internet và thử lại.</p>
                            <button class="btn btn-primary" onclick="loadExams()" style="margin-top:12px;">
                                <i class="fas fa-sync"></i> Thử lại
                            </button>
                        </div>
                    `;
                }
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        function renderExams() {
            localStorage.setItem('cachedExams', JSON.stringify(allExams));

            const suggested = allExams.slice(0, 3);
            const container1 = document.getElementById('suggestedExams');

            if (suggested.length === 0) {
                container1.innerHTML = `
                    <div class="no-exams">
                        <div class="icon">📭</div>
                        <h4>Chưa có đề thi nào</h4>
                        <p>Hãy tạo đề thi đầu tiên của bạn!</p>
                    </div>
                `;
            } else {
                container1.innerHTML = suggested.map(exam => examHTML(exam)).join('');
            }

            const container2 = document.getElementById('allExams');

            if (allExams.length === 0) {
                container2.innerHTML = `
                    <div class="no-exams">
                        <div class="icon">📭</div>
                        <h4>Chưa có đề thi nào</h4>
                        <p>Nhấn nút <strong>"Tạo đề thi"</strong> để bắt đầu!</p>
                    </div>
                `;
            } else {
                container2.innerHTML = allExams.map(exam => examHTML(exam)).join('');
            }
        }

        function examHTML(exam) {
            const isTeacher = currentUser && currentUser.role === 'teacher';
            const questionCount = exam.questions ? exam.questions.length : 0;
            const createdDate = exam.createdAt || 'Mới tạo';

            const folderName = exam.folderId ?
                (allFolders.find(f => f.id === exam.folderId)?.name || '') :
                '';

            return `
                <div class="exam-item" data-title="${(exam.title || '').toLowerCase()}">
                    <div class="exam-info">
                        <h4>📄 ${exam.title || 'Đề thi không tên'}</h4>
                        <p>⏱ ${exam.duration || 0} phút · ${questionCount} câu hỏi</p>
                        <div class="tags">
                            <span class="tag">📅 ${createdDate}</span>
                            ${exam.status ? `<span class="tag">${exam.status}</span>` : ''}
                            ${folderName ? `<span class="tag" style="background:#f39c12; color:white;">📁 ${folderName}</span>` : ''}
                        </div>
                    </div>
                    <div class="exam-actions">
                        ${isTeacher ? `
                            <button class="btn btn-primary btn-sm" onclick="editExam('${exam.id}')">
                                <i class="fas fa-edit"></i> Sửa
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteExam('${exam.id}')">
                                <i class="fas fa-trash"></i> Xóa
                            </button>
                        ` : ''}
                        <button class="btn btn-success btn-sm" onclick="viewExam('${exam.id}')">
                            <i class="fas fa-eye"></i> Xem
                        </button>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // ACTIONS
        // ============================================================

        function filterExams() {
            const keyword = document.getElementById('searchExam').value.toLowerCase();
            const items = document.querySelectorAll('#allExams .exam-item');
            let found = false;

            items.forEach(item => {
                const title = item.dataset.title || '';
                if (title.includes(keyword)) {
                    item.style.display = 'flex';
                    found = true;
                } else {
                    item.style.display = 'none';
                }
            });

            const container = document.getElementById('allExams');
            const noResult = container.querySelector('.no-result');
            if (noResult) noResult.remove();

            if (!found && items.length > 0) {
                const div = document.createElement('div');
                div.className = 'no-exams no-result';
                div.innerHTML = `
                    <div class="icon">🔍</div>
                    <h4>Không tìm thấy đề thi</h4>
                    <p>Thử tìm kiếm với từ khóa khác</p>
                `;
                container.appendChild(div);
            }
        }

        async function deleteExam(examId) {
            if (!confirm('Bạn có chắc chắn muốn xóa đề thi này?')) return;

            try {
                await db.collection('exams').doc(examId).delete();
                allExams = allExams.filter(e => e.id !== examId);
                renderExams();
                alert('✅ Đã xóa đề thi thành công!');

            } catch (error) {
                console.error('Lỗi xóa đề thi:', error);
                alert('❌ Không thể xóa đề thi. Vui lòng thử lại!');
            }
        }

        function viewExam(examId) {
            const exam = allExams.find(e => e.id === examId);
            if (!exam) {
                alert('Không tìm thấy đề thi!');
                return;
            }

            const questionList = exam.questions ? exam.questions.map((q, i) => {
                const options = q.options ? q.options.map((opt, oi) =>
                    `    ${['A','B','C','D'][oi]}. ${opt}`
                ).join('\n') : '';
                return `Câu ${i+1}: ${q.content}\n${options}\nĐáp án: ${['A','B','C','D'][q.correct]}`;
            }).join('\n\n') : 'Không có câu hỏi';

            alert(`📄 ${exam.title}\n⏱ ${exam.duration} phút\n📝 ${exam.questions ? exam.questions.length : 0} câu hỏi\n\n${questionList}`);
        }

        function editExam(examId) {
            localStorage.setItem('editingExamId', examId);
            window.location.href = 'create-manual.html';
        }

        // ============================================================
        // INIT
        // ============================================================

        auth.onAuthStateChanged((user) => {
            if (!user) {
                localStorage.removeItem('quizCurrentUser');
                window.location.href = 'index.html';
            }
        });

        checkAuth();
    </script>

</body>
</html>
